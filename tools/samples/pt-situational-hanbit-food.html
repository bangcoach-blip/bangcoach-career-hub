<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PT면접 샘플 · 마케팅 (한빛푸드)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
:root{
  color-scheme:light;
  --paper:#fff; --desk:#e8eaee; --ink:#111827; --ink-2:#374151; --muted:#6b7280; --soft:#9ca3af;
  --rule:#d1d5db; --rule-2:#9aa1ab; --head:#f3f4f6; --blue:#1c60ef; --blue-tint:#eef4ff; --blue-2:#dbe8fe;
  --c-c:#0369a1; --c-p:#2563eb; --c-r:#0d9488; --c-e:#7c3aed; --c-p2:#ea580c; --c-f:#0891b2; --c-l:#be123c;
  --ok:#15803d; --warn:#b45309; --bad:#dc2626; --as:#fef3c7;
  --font:"Pretendard Variable",Pretendard,"Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:20px}
body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--font);font-size:14.5px;line-height:1.75;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
a{color:inherit}
button{font-family:inherit}
#app{max-width:880px;background:var(--paper);margin:28px auto 96px;padding:56px 64px 44px;box-shadow:0 1px 3px rgba(0,0,0,.12),0 10px 30px rgba(0,0,0,.06);counter-reset:sec}

/* 도구 상자 */
.dock{position:fixed;right:18px;bottom:18px;z-index:40;display:flex;gap:8px;align-items:center;background:#fff;border:1px solid var(--rule);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.14);padding:8px 10px}
.dock[hidden]{display:none}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:15px;padding:5px 10px;border-radius:5px;background:var(--blue-tint);color:var(--blue);min-width:66px;text-align:center}
.timer.low{background:#fef2f2;color:var(--bad)}
.btn{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--rule-2);background:#fff;color:var(--ink-2);padding:6px 12px;border-radius:5px;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{color:#fff;opacity:.92}
.btn.dark{background:#111827;border-color:#111827;color:#fff}
.btn.big{font-size:14.5px;padding:10px 18px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}

/* 문서 머리말 */
.doc-top{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;color:var(--muted);border-bottom:1px solid #111;padding-bottom:6px;margin-bottom:26px}
.doc-head{border-bottom:3px double #111;padding-bottom:22px}
h1{font-size:25px;text-align:center;letter-spacing:-.03em;line-height:1.45;margin:0 0 20px}
.sub{text-align:center;color:var(--ink-2);margin:-8px 0 22px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{border:1px solid var(--rule);padding:8px 11px;vertical-align:top;text-align:left}
th{background:var(--head);color:#111;font-weight:700;font-size:12.5px}
table.info{border:1.5px solid #111}
table.info th{width:13%;text-align:center;white-space:nowrap;border-color:var(--rule-2)}
table.info td{border-color:var(--rule-2);color:#111}
.tw{overflow-x:auto}
.sign-row{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-top:14px;font-size:13px;color:var(--ink-2);flex-wrap:wrap}
.sign{border:0;border-bottom:1px solid #111;font:inherit;width:130px;padding:2px 4px;text-align:center;background:transparent;color:#111}
.sign:focus{outline:none;border-bottom-color:var(--blue)}
.toc{margin-top:18px;font-size:13.5px;border:1px solid var(--rule);padding:12px 16px}
.toc b{display:block;font-size:12.5px;margin-bottom:4px}
.toc ol{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(3,1fr);gap:2px 16px;counter-reset:t}
.toc li{counter-increment:t}
.toc li::before{content:counter(t,upper-roman) ". ";color:var(--soft)}
.toc a{text-decoration:none}
.toc a:hover{text-decoration:underline}

/* 장 */
section{padding:40px 0 4px;counter-increment:sec}
section h2{font-size:20px;border-bottom:2px solid #111;padding-bottom:6px;margin:0 0 10px;letter-spacing:-.02em;line-height:1.4}
section h2::before{content:counter(sec,upper-roman) ". ";color:var(--blue)}
h3{font-size:16.5px;margin:26px 0 10px;letter-spacing:-.02em}
.lead{color:var(--ink-2);font-size:13.5px;margin:0 0 16px}
.k{color:#111;font-size:13.5px;font-weight:800;border-left:3px solid #111;padding-left:8px;margin:24px 0 10px}
.note{font-size:13px;color:var(--muted)}
.rich p{margin:0 0 6px}
.rich p:last-child{margin:0}
mark.as{background:linear-gradient(transparent 55%,var(--as) 55%);color:inherit;padding:0 1px}

/* 문제 상자 */
.qbox{border:1.5px solid #111;padding:22px 26px;display:flex;flex-direction:column;gap:16px}
.qtitle{font-size:17.5px;font-weight:800;letter-spacing:-.02em;line-height:1.55;margin:0}
.qtitle em{font-style:normal;color:var(--blue);margin-right:6px}
.box{background:#fafbfc;border:1px solid #e5e7eb;padding:13px 16px}
.box h4{margin:0 0 6px;font-size:13px}
.abil{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;border:1px solid var(--rule-2);padding:1px 8px;border-radius:2px;color:var(--ink-2);background:#fff;white-space:nowrap}
.tag.blue{border-color:var(--blue-2);background:var(--blue-tint);color:var(--blue)}
.tag.ok{border-color:#bbf7d0;background:#f0fdf4;color:var(--ok)}
.tag.warn{border-color:#fde68a;background:#fffbeb;color:var(--warn)}
.tag.gray{color:var(--muted)}

/* 선택지 */
.opts{display:flex;flex-direction:column;gap:10px}
.opt{border:1px solid var(--rule);display:grid;grid-template-columns:44px 1fr}
.opt .lab{background:#111;color:#fff;font-weight:800;font-size:17px;display:flex;align-items:flex-start;justify-content:center;padding-top:12px}
.opt .ob{padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.opt .ob b{font-size:15px}
.opt .pc{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px}
.opt .pc div{padding:6px 10px;border:1px solid #e5e7eb}
.opt .pro{background:#f0fdf4;color:#166534}.opt .con{background:#fff7ed;color:#9a3412}

/* 자료 — 한 장씩 넓게 */
.mats{display:flex;flex-direction:column;gap:16px}
.mat{border:1px solid var(--rule-2);break-inside:avoid;page-break-inside:avoid}
.mat-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--head);border-bottom:1px solid var(--rule-2);padding:9px 14px}
.mat-no{background:#111;color:#fff;font-size:12px;font-weight:800;padding:2px 9px;white-space:nowrap}
.mat-h b{font-size:15px;flex:1;min-width:200px;letter-spacing:-.01em}
.mat-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.mat-b{padding:14px 16px;font-size:14.5px;line-height:1.85;display:flex;flex-direction:column;gap:10px}
.mat-b table{font-size:14px}
.mat-b th{text-align:center}
.mat-b td{text-align:center}
.mat-b td:first-child{text-align:left;font-weight:600;color:#111}
.mat-b tbody tr:nth-child(even) td{background:#fafbfc}
.mat-s{border-top:1px dashed var(--rule);padding:6px 16px;font-size:12px;color:var(--muted)}
.voice{border-left:3px solid var(--rule-2);padding:2px 0 2px 12px;color:#111}

/* 문제 은행 목록 */
.area{margin-top:22px}
.area-h{display:flex;align-items:baseline;gap:10px;border-bottom:1.5px solid #111;padding-bottom:5px}
.area-h b{font-size:17px}
.area-h span{font-size:13px;color:var(--muted)}
.plist{display:flex;flex-direction:column}
.prow{display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--rule);cursor:pointer}
.prow:hover{background:#f8faff}
.prow .pid{font-weight:800;color:var(--blue);font-size:15px}
.prow .pt{font-weight:700;font-size:15px;line-height:1.5}
.prow .ps{font-size:13px;color:var(--muted);margin:2px 0 6px}
.prow .pm{display:flex;gap:6px;flex-wrap:wrap}
.banner{border:1px solid var(--blue-2);background:var(--blue-tint);padding:10px 14px;font-size:13.5px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:0 0 6px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 0}
.steps-t td:first-child{width:56px;text-align:center;font-weight:800;color:var(--blue)}

/* 답안 */
.grp{border:1px solid var(--rule);padding:16px 18px 18px;margin-bottom:14px}
.gh{display:flex;gap:10px;align-items:center}
.gh b{font-size:16.5px;letter-spacing:-.02em}
.gn{font-size:12px;font-weight:800;color:#fff;background:#111;padding:2px 9px}
.gd{margin:2px 0 12px;font-size:13px;color:var(--muted)}
.fld{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.fld:first-child{margin-top:0}
.fld label{font-weight:800;font-size:14px}
.fld textarea{font:inherit;font-size:14.5px;border:1px solid var(--rule-2);width:100%;resize:vertical;color:#111;background-color:#fff;background-image:repeating-linear-gradient(transparent 0 27px,#e5e7eb 27px 28px);background-attachment:local;line-height:28px;padding:0 10px;min-height:112px}
.fld textarea:focus{outline:1px solid var(--blue);border-color:var(--blue)}
.fld .cnt{font-size:12px;color:var(--soft);text-align:right}
.two2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.two2 .fld{margin-top:0}
.pick{display:flex;gap:8px;flex-wrap:wrap}
.pick label{display:flex;align-items:center;gap:8px;border:1px solid var(--rule-2);padding:8px 13px;cursor:pointer;font-size:14px;font-weight:600;background:#fff}
.pick label.on{border-color:var(--blue);background:var(--blue-tint);color:var(--blue)}
.pick input{accent-color:var(--blue)}

/* 해설 받기 */
.req{border:1.5px dashed var(--blue);padding:18px 20px;display:flex;flex-direction:column;gap:12px;background:#fbfcff}
.req ol{margin:0;padding-left:20px}
.req li{margin-bottom:4px}
.req textarea{font:12.5px/1.5 ui-monospace,Consolas,monospace;border:1px solid var(--rule-2);width:100%;min-height:120px;padding:10px}
.err{color:var(--bad);font-size:13px}

/* 비교·방향·시나리오·흐름 */
.pill{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:21px;border-radius:2px;color:#fff;font-size:11.5px;font-weight:800;padding:0 6px}
.p-C{background:var(--c-c)}.p-P{background:var(--c-p)}.p-R{background:var(--c-r)}.p-E{background:var(--c-e)}.p-P2{background:var(--c-p2)}.p-F{background:var(--c-f)}.p-L{background:var(--c-l)}.p-S{background:var(--c-e)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);align-items:center;margin:0 0 12px}
.legend span{display:inline-flex;gap:6px;align-items:center}
.cmp td.me{white-space:pre-wrap;color:var(--ink-2);width:40%}
.cmp td.me.empty{color:var(--soft);font-style:italic}
.cmp td.ai{background:#f6f8fc;width:42%}
.cmp td.st{width:18%;font-weight:700;font-size:13px}
.cmp td.st .pill{margin-bottom:4px}
.hit{font-size:12.5px;font-weight:700;white-space:nowrap}
.hit.y{color:var(--ok)}.hit.n{color:var(--warn)}
.chk{display:grid;grid-template-columns:24px 1fr;gap:10px;padding:10px 14px;border-bottom:1px solid var(--rule);font-size:14px;cursor:pointer}
.chk input{width:17px;height:17px;accent-color:var(--blue);margin-top:4px}
.chk small{display:block;color:var(--muted);font-size:12.5px}
.score{padding:12px 14px;background:var(--head);font-size:14px}
.score b{font-size:18px;color:var(--blue);margin:0 8px}
.dgrp{margin:18px 0 0;font-size:13px;font-weight:800;background:var(--head);border-left:4px solid #111;padding:6px 12px}
.st{display:grid;grid-template-columns:160px 1fr;gap:18px;padding:16px 0;border-bottom:1px solid var(--rule)}
.st .lab{font-weight:800;font-size:13.5px;display:flex;flex-direction:column;gap:4px}
.st .body{display:flex;flex-direction:column;gap:8px;font-size:14.5px}
.frame{font-size:13.5px;border-left:3px solid var(--blue);padding:4px 0 4px 12px;background:#fbfcff}
.hint{font-size:13.5px;background:#fafbfc;border:1px solid #e5e7eb;padding:8px 12px}
.warnbox{font-size:13px;color:#9a3412;background:#fff7ed;border:1px solid #fed7aa;padding:7px 12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px}
.seq{display:flex;gap:5px;flex-wrap:wrap;align-items:center;padding:12px 14px;border:1px solid var(--rule);margin-bottom:12px;font-size:12.5px}
.seq .ar{color:var(--soft)}
.stimer{display:flex;gap:12px;align-items:center;padding:12px 16px;border:1px solid var(--rule);margin-bottom:14px;flex-wrap:wrap}
.stimer .big{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--blue);min-width:80px}
.stimer .big.low{color:var(--bad)}
.stimer small{color:var(--muted);font-size:13px;flex:1;min-width:200px}
.sc{border:1px solid var(--rule);padding:16px 20px;margin-bottom:12px;display:flex;flex-direction:column;gap:10px;break-inside:avoid}
.sc h4{margin:0;font-size:16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sc h4 .no{color:var(--blue)}
.sc .script{font-size:15px;line-height:1.95}
.applyl{font-size:13.5px;border-left:3px solid var(--blue);padding:3px 0 3px 12px}
.checkl{font-size:13px;color:var(--muted);border-top:1px dashed var(--rule);padding-top:8px}
.fbar{display:flex;height:10px;gap:2px;margin:4px 0 12px}
.fbar i{display:block;height:100%;background:var(--blue)}
.fbar i:nth-child(2n){background:#7aa6f7}
.fl{display:grid;grid-template-columns:28px 1fr;gap:12px;padding:8px 0;border-bottom:1px dashed var(--rule)}
.fl .n{width:24px;height:24px;border-radius:50%;background:var(--blue-tint);color:var(--blue);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
.fl .t{font-weight:700;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.fl .t .m{font-weight:500;color:var(--soft);font-size:12px}
.fl .cn{font-size:13.5px;color:var(--ink-2)}
.fl .cn em{font-style:normal;font-weight:700;color:var(--blue);margin-right:6px;font-size:12px}
.status{font-size:12px;font-weight:800;padding:1px 8px;border:1px solid currentColor;white-space:nowrap}
.s-ok{color:var(--ok)}.s-warn{color:var(--warn)}
.fb{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fb > div{border:1px solid var(--rule);padding:12px 16px}
.fb h4{margin:0 0 6px;font-size:13.5px}
.fb ul{margin:0;padding-left:18px}
.rew{border:1px solid var(--blue-2);background:var(--blue-tint);padding:12px 16px;margin-top:12px}
.locked{border:1px dashed var(--rule-2);padding:18px 20px;color:var(--muted);text-align:center}
footer{border-top:1px solid #111;margin-top:34px;padding:12px 0 0;color:var(--muted);font-size:12.5px}
details.pv summary{cursor:pointer;font-weight:700;padding:8px 0}
details.pv pre{max-height:380px;overflow:auto;background:#f8fafc;border:1px solid var(--rule);padding:12px;font:12px/1.55 ui-monospace,Consolas,monospace;white-space:pre-wrap}
details.faq{border-bottom:1px solid var(--rule);padding:8px 0}
details.faq summary{cursor:pointer;font-weight:700}
details.faq p{margin:6px 0 0;color:var(--ink-2)}
dialog{border:0;border-radius:10px;padding:0;width:min(720px,calc(100% - 32px));box-shadow:0 20px 60px rgba(15,23,42,.3)}
dialog::backdrop{background:rgba(15,23,42,.4)}
.dlg{padding:22px}
.dlg h3{margin:0 0 4px}
.dlg p{margin:0 0 10px;color:var(--muted);font-size:13.5px}
.dlg textarea{width:100%;height:280px;font:12.5px/1.5 ui-monospace,Consolas,monospace;border:1px solid var(--rule-2);padding:12px}
.dlg .row{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111;color:#fff;font-size:13.5px;padding:10px 16px;border-radius:8px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (max-width:760px){
  #app{margin:0;padding:28px 18px 110px;box-shadow:none}
  h1{font-size:21px}
  .toc ol{grid-template-columns:1fr 1fr}
  table.info th{width:auto}
  .two2,.fb,.opt .pc{grid-template-columns:1fr}
  .st{grid-template-columns:1fr;gap:6px}
  .prow{grid-template-columns:40px 1fr}
  .prow > .btn{grid-column:2;justify-self:start}
  .dock{left:10px;right:10px;bottom:58px;justify-content:center;flex-wrap:wrap}
  .cmp td.st,.cmp td.me,.cmp td.ai{width:auto}
}
@media print{
  @page{size:A4;margin:15mm}
  body{background:#fff}
  #app{box-shadow:none;margin:0;padding:0;max-width:none}
  .dock,.toast,.acts,.req,[data-noexport]{display:none!important}
}
</style>
</head>
<body>
<div class="dock" id="dock" hidden>
  <a class="btn" href="#" id="toList">← 문제 목록</a>
  <span class="timer" id="timer" title="작성 제한 시간">00:00</span>
  <button class="btn" id="tToggle">시작</button>
  <span id="dlHost"></span>
</div>
<main id="app"></main>
<dialog id="dlg"><div class="dlg">
  <h3>AI가 준 JSON 붙여넣기</h3>
  <p>문제 은행 JSON 또는 해설 JSON 코드 블록 전체를 붙여 넣으세요. 어떤 데이터인지 자동으로 알아봅니다. 이 브라우저에만 저장됩니다.</p>
  <textarea id="ta" spellcheck="false" placeholder='{"kind": "pt-bank", ...}  또는  {"kind": "pt-solution", ...}'></textarea>
  <div class="row"><span class="err" id="err"></span><span><button class="btn" id="dlgClose">닫기</button> <button class="btn primary" id="dlgOk">불러오기</button></span></div>
</div></dialog>
<div class="toast" id="toast"></div>
<noscript>이 페이지는 자바스크립트가 켜진 브라우저에서 열어주세요.</noscript>

<script>/* 방코치 다운로드 모듈 — 화면의 결과물을 Markdown(.md) / Word(.doc) / PDF(.pdf)로 내려받습니다.
   사용: BCExport.mount({ host: '.tools', target: '#app', name: () => '파일이름', title: () => '문서 제목', exclude: '.top,#work' })
   - host: 버튼을 넣을 자리(없으면 화면 오른쪽 아래에 떠 있는 버튼)
   - target: 내려받을 영역
   - exclude: 내려받을 때 뺄 부분(CSS 선택자) */
(function () {
  if (window.BCExport) return;
  var CSS =
    '.bcx-wrap{position:relative;display:inline-block;font-family:"Pretendard Variable",Pretendard,"Malgun Gothic",sans-serif}' +
    '.bcx-float{position:fixed;right:18px;bottom:18px;z-index:2147482000}' +
    '.bcx-btn{font:inherit;font-size:13px;font-weight:700;border:1px solid #1c60ef;background:#1c60ef;color:#fff;padding:7px 13px;border-radius:6px;cursor:pointer;white-space:nowrap}' +
    '.bcx-btn:hover{opacity:.92}' +
    '.bcx-menu{position:absolute;right:0;bottom:calc(100% + 6px);min-width:250px;background:#fff;border:1px solid #cbd5e1;border-radius:10px;box-shadow:0 12px 32px rgba(15,23,42,.18);padding:6px;display:none;z-index:2147482001;text-align:left}' +
    '.bcx-wrap.down .bcx-menu{bottom:auto;top:calc(100% + 6px)}' +
    '.bcx-wrap.open .bcx-menu{display:block}' +
    '.bcx-menu p{margin:4px 8px 6px;font-size:12px;color:#64748b;font-weight:600}' +
    '.bcx-menu button{display:flex;width:100%;gap:10px;align-items:center;border:0;background:none;padding:9px 10px;border-radius:7px;cursor:pointer;font:inherit;text-align:left;color:#0f172a}' +
    '.bcx-menu button:hover{background:#eef4ff}' +
    '.bcx-menu b{display:inline-flex;align-items:center;justify-content:center;min-width:42px;height:24px;border-radius:5px;font-size:11.5px;color:#fff}' +
    '.bcx-menu span{display:flex;flex-direction:column;font-size:13.5px;font-weight:700}' +
    '.bcx-menu small{font-size:12px;color:#64748b;font-weight:500}' +
    '.bcx-busy{position:fixed;inset:0;background:rgba(15,23,42,.35);z-index:2147482500;display:flex;align-items:center;justify-content:center;font:600 14px/1.5 "Pretendard Variable",Pretendard,"Malgun Gothic",sans-serif;color:#0f172a}' +
    '.bcx-busy div{background:#fff;border-radius:12px;padding:18px 22px;box-shadow:0 20px 50px rgba(0,0,0,.25)}' +
    '.bcx-answer{border:1px solid #9aa1ab;padding:8px 10px;white-space:pre-wrap;margin:4px 0 8px;min-height:36px;background:#fff}' +
    '.bcx-input{border-bottom:1px solid #111;padding:0 6px}' +
    '@media print{.bcx-wrap,.bcx-float{display:none!important}}';
  var DOC_CSS =
    'body{font-family:"맑은 고딕","Malgun Gothic",sans-serif;font-size:10.5pt;line-height:1.6;color:#111}' +
    'h1{font-size:18pt;text-align:center;margin:0 0 12pt}h2{font-size:14pt;border-bottom:1.5pt solid #111;padding-bottom:3pt;margin:18pt 0 8pt}' +
    'h3{font-size:12pt;margin:12pt 0 6pt}h4{font-size:11pt;margin:10pt 0 4pt}p{margin:3pt 0}' +
    'table{border-collapse:collapse;width:100%;margin:6pt 0}th,td{border:1px solid #999;padding:4pt 6pt;vertical-align:top;font-size:10pt;text-align:left}th{background:#f0f2f5}' +
    '.bcx-answer{border:1px solid #999;padding:6pt;margin:4pt 0}mark{background:#fef3c7}';

  function addStyle() {
    if (document.getElementById('bcx-style')) return;
    var s = document.createElement('style'); s.id = 'bcx-style'; s.textContent = CSS; document.head.appendChild(s);
  }
  function el(tag, attrs, html) { var e = document.createElement(tag); for (var k in attrs || {}) e.setAttribute(k, attrs[k]); if (html != null) e.innerHTML = html; return e; }
  function val(x) { return typeof x === 'function' ? x() : x; }
  function safeName(s) { return String(s || '결과물').replace(/[\\/:*?"<>|\n\r\t]+/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 80) || '결과물'; }
  function esc(s) { return String(s).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }
  function save(blob, filename) {
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  }

  /* 내려받을 복사본: 입력값은 글자로 바꾸고, 버튼·숨김 요소는 뺀다 */
  function prepare(o) {
    var src = val(o.target); if (typeof src === 'string') src = document.querySelector(src);
    if (!src) throw new Error('내려받을 내용을 찾지 못했습니다.');
    var c = src.cloneNode(true);
    var sa = src.querySelectorAll('textarea,input,select'), ca = c.querySelectorAll('textarea,input,select');
    for (var i = 0; i < ca.length; i++) {
      var e = ca[i], s = sa[i], rep = null;
      if (e.tagName === 'TEXTAREA') { rep = el('div', { 'class': 'bcx-answer' }); rep.textContent = s.value || '(작성하지 않음)'; }
      else if (e.type === 'checkbox' || e.type === 'radio') rep = document.createTextNode(s.checked ? '☑ ' : '☐ ');
      else if (e.tagName === 'SELECT') rep = document.createTextNode(s.value);
      else if (e.type !== 'hidden' && e.type !== 'button' && e.type !== 'submit') { rep = el('span', { 'class': 'bcx-input' }); rep.textContent = s.value || '      '; }
      if (rep) e.parentNode.replaceChild(rep, e); else e.parentNode.removeChild(e);
    }
    var rm = 'button,script,style,dialog,noscript,template,.bcx-wrap,[hidden],[data-noexport]' + (o.exclude ? ',' + o.exclude : '');
    Array.prototype.forEach.call(c.querySelectorAll(rm), function (x) { if (x.parentNode) x.parentNode.removeChild(x); });
    Array.prototype.forEach.call(c.querySelectorAll('details'), function (d) { d.setAttribute('open', ''); });
    Array.prototype.forEach.call(c.querySelectorAll('[id]'), function (x) { x.removeAttribute('id'); });
    return c;
  }

  /* Markdown 변환 */
  var BLOCK = /^(P|DIV|SECTION|HEADER|FOOTER|MAIN|ARTICLE|ASIDE|NAV|UL|OL|LI|TABLE|THEAD|TBODY|TR|H1|H2|H3|H4|H5|H6|BLOCKQUOTE|PRE|DL|DT|DD|FORM|FIGURE|FIGCAPTION|LABEL|DETAILS|SUMMARY|FIELDSET|HR)$/;
  function hasBlock(n) { for (var i = 0; i < n.children.length; i++) { if (BLOCK.test(n.children[i].tagName) || hasBlock(n.children[i])) return true; } return false; }
  function inline(n) {
    var s = '';
    n.childNodes.forEach(function (ch) {
      if (ch.nodeType === 3) s += ch.nodeValue.replace(/\s+/g, ' ');
      else if (ch.nodeType === 1) {
        var t = ch.tagName.toUpperCase();
        if (t === 'BR') s += '  \n';
        else if (t === 'SVG' || t === 'IMG' || t === 'CANVAS') return;
        else if (t === 'STRONG' || t === 'B') { var v = inline(ch).trim(); if (v) s += ' **' + v + '** '; }
        else if (t === 'EM' || t === 'I') { var w = inline(ch).trim(); if (w) s += ' *' + w + '* '; }
        else if (BLOCK.test(t)) s += ' ' + inline(ch) + ' ';
        else s += inline(ch) + ' ';
      }
    });
    return s;
  }
  function clean(s) { return s.replace(/[ \t]+/g, ' ').replace(/ ?\n ?/g, '\n').replace(/\*\* +\*\*/g, ' ').trim(); }
  function toMd(root, title) {
    var out = [], buf = '';
    function flush() { var t = clean(buf); if (t) out.push(t); buf = ''; }
    function cell(x) { return clean(inline(x)).replace(/\|/g, '\\|').replace(/\n+/g, '<br>'); }
    function walk(n) {
      n.childNodes.forEach(function (ch) {
        if (ch.nodeType === 3) { buf += ch.nodeValue.replace(/\s+/g, ' '); return; }
        if (ch.nodeType !== 1) return;
        var t = ch.tagName.toUpperCase();
        if (t === 'SVG' || t === 'IMG' || t === 'CANVAS') return;
        if (/^H[1-6]$/.test(t)) { flush(); var lv = Math.min(+t[1], 4); var ht = clean(inline(ch)); if (ht) out.push('#'.repeat(lv) + ' ' + ht); return; }
        if (t === 'HR') { flush(); out.push('---'); return; }
        if (t === 'UL' || t === 'OL') {
          flush(); var k = 0, items = [];
          Array.prototype.forEach.call(ch.children, function (li) { if (li.tagName !== 'LI') return; k++; var lt = clean(inline(li)).replace(/\n/g, ' '); if (lt) items.push((t === 'OL' ? k + '. ' : '- ') + lt); });
          if (items.length) out.push(items.join('\n'));
          return;
        }
        if (t === 'TABLE') {
          flush(); var rows = Array.prototype.filter.call(ch.querySelectorAll('tr'), function () { return true; });
          if (!rows.length) return;
          var lines = [];
          rows.forEach(function (tr, i) {
            var cells = Array.prototype.map.call(tr.children, cell);
            lines.push('| ' + cells.join(' | ') + ' |');
            if (i === 0) lines.push('|' + cells.map(function () { return ' --- '; }).join('|') + '|');
          });
          out.push(lines.join('\n')); return;
        }
        if (ch.classList && ch.classList.contains('bcx-answer')) { flush(); out.push(ch.textContent.split('\n').map(function (l) { return '> ' + l; }).join('\n')); return; }
        if (BLOCK.test(t)) { if (hasBlock(ch)) { flush(); walk(ch); flush(); } else { flush(); buf = inline(ch); flush(); } return; }
        if (hasBlock(ch)) { flush(); walk(ch); flush(); } else buf += inline(ch);
      });
    }
    walk(root); flush();
    var md = out.join('\n\n');
    if (title && !/^# /m.test(md)) md = '# ' + title + '\n\n' + md;
    return md + '\n';
  }

  function toDoc(c, title) {
    return '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">' +
      '<head><meta charset="utf-8"><title>' + esc(title) + '</title><!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View><w:Zoom>100</w:Zoom></w:WordDocument></xml><![endif]-->' +
      '<style>@page{size:21cm 29.7cm;margin:2cm 1.8cm}' + DOC_CSS + '</style></head><body>' + c.innerHTML + '</body></html>';
  }

  /* PDF: A4 본문 폭(186mm≈703px)에 맞춰 다시 배치 → 쪽 경계를 직접 정해 몇 쪽씩 나눠 그린다.
     (한 번에 통째로 그리면 휴대폰에서 캔버스 한도를 넘어 빈 쪽·잘림이 생김) */
  var PDF_LIBS = [
    ['html2canvas', 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'],
    ['jspdf', 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js']
  ];
  function loadPdfLib() {
    return Promise.all(PDF_LIBS.map(function (L) {
      return new Promise(function (res, rej) {
        if (window[L[0]]) return res();
        var s = document.createElement('script'); s.src = L[1]; s.onload = res; s.onerror = rej; document.head.appendChild(s);
      });
    }));
  }
  function busy(on, msg) {
    var b = document.getElementById('bcx-busy');
    if (on) { if (!b) { b = el('div', { id: 'bcx-busy', 'class': 'bcx-busy' }, '<div></div>'); document.body.appendChild(b); } b.firstChild.textContent = msg; }
    else if (b) b.remove();
  }
  var PDF_FIX =
    '.bcx-pdf,.bcx-pdf *{box-sizing:border-box!important;max-width:100%!important;overflow-wrap:anywhere;word-break:keep-all;animation:none!important;transition:none!important}' +
    '.bcx-pdf{width:703px!important;margin:0!important;padding:4px 2px!important;border:0!important;border-radius:0!important;box-shadow:none!important;background:#fff!important;overflow:visible!important}' +
    '.bcx-pdf table{table-layout:fixed;width:100%!important}.bcx-pdf pre{white-space:pre-wrap}' +
    '.bcx-pdf [style*="position:sticky"],.bcx-pdf [style*="position: sticky"]{position:static!important}' +
    '.bcx-pdf img,.bcx-pdf svg,.bcx-pdf canvas{height:auto}';
  /* 쪽 경계: 잘리면 안 되는 덩어리(표 줄·제목·문항 카드 등) 중간이면 그 덩어리 위에서 끊는다 */
  function pageCuts(c, pageH, avoidSel) {
    var top0 = c.getBoundingClientRect().top, total = c.scrollHeight;
    var blocks = Array.prototype.map.call(c.querySelectorAll(avoidSel), function (b) {
      var r = b.getBoundingClientRect(); return [r.top - top0, r.bottom - top0];
    }).filter(function (r) { return r[1] - r[0] > 0 && r[1] - r[0] < pageH * 0.9; });
    var heads = Array.prototype.map.call(c.querySelectorAll('h1,h2,h3,h4'), function (h) { return h.getBoundingClientRect().top - top0; });
    var cuts = [0], y = 0;
    while (y + pageH < total) {
      var cut = y + pageH, moved = true, guard = 0;
      while (moved && guard++ < 50) {
        moved = false;
        for (var i = 0; i < blocks.length; i++) {
          if (blocks[i][0] < cut - 1 && blocks[i][1] > cut + 1 && blocks[i][0] > y + pageH * 0.3) { cut = Math.floor(blocks[i][0]) - 2; moved = true; }
        }
        for (var j = 0; j < heads.length; j++) {   /* 제목이 쪽 맨 아래에 홀로 남지 않게 */
          if (heads[j] < cut && heads[j] > cut - 60 && heads[j] > y + pageH * 0.3) { cut = Math.floor(heads[j]) - 4; moved = true; }
        }
      }
      if (cut <= y + 40) cut = y + pageH;
      cuts.push(cut); y = cut;
    }
    cuts.push(total);
    return cuts;
  }
  function toPdf(c, name, o) {
    var W = 703, MX = 12, MT = 12, MB = 14, PW = 210, PH = 297;
    var pxPerMm = W / (PW - MX * 2), pageH = Math.floor((PH - MT - MB) * pxPerMm);
    c.classList.add('bcx-pdf'); c.removeAttribute('style');
    c.insertBefore(el('style', {}, PDF_FIX), c.firstChild);
    var box = el('div', { 'class': 'bcx-pdfbox' });
    box.style.cssText = 'position:absolute;left:0;top:0;width:' + W + 'px;background:#fff;z-index:-1;pointer-events:none';
    box.appendChild(c); document.body.appendChild(box);
    var sx = window.scrollX, sy = window.scrollY;
    busy(true, 'PDF를 만드는 중입니다… (내용이 길면 10초 정도 걸려요)');
    var avoid = ['tr', 'h1', 'h2', 'h3', 'h4', 'li', 'p', 'img', 'figure', 'blockquote', '.bcx-answer', '.bcx-avoid'].concat(o.avoid || []).join(',');
    return loadPdfLib().then(function () {
      return (document.fonts && document.fonts.ready) || null;
    }).then(function () {
      window.scrollTo(0, 0);
      var cuts = pageCuts(c, pageH, avoid);
      var JsPDF = window.jspdf.jsPDF, pdf = new JsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });
      var scale = Math.min(2, Math.max(1, window.devicePixelRatio || 1.6));
      var rect = c.getBoundingClientRect(), ox = rect.left + window.scrollX, oy = rect.top + window.scrollY;
      var p = 0, PER = 3;   /* 한 번에 3쪽씩 그림(휴대폰 캔버스 한도 안쪽) */
      function step() {
        if (p >= cuts.length - 1) return;
        var from = cuts[p], last = Math.min(p + PER, cuts.length - 1), to = cuts[last];
        busy(true, 'PDF를 만드는 중입니다… (' + Math.min(last, cuts.length - 1) + ' / ' + (cuts.length - 1) + '쪽)');
        return window.html2canvas(c, {
          scale: scale, useCORS: true, backgroundColor: '#ffffff', logging: false,
          x: ox, y: oy + from, width: W, height: to - from,
          windowWidth: Math.max(document.documentElement.clientWidth, W + 40), scrollX: 0, scrollY: 0
        }).then(function (cv) {
          for (var k = p; k < last; k++) {
            var h = cuts[k + 1] - cuts[k]; if (h <= 0) continue;
            var pc = document.createElement('canvas'); pc.width = cv.width; pc.height = Math.round(h * scale);
            var g = pc.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, pc.width, pc.height);
            g.drawImage(cv, 0, Math.round((cuts[k] - from) * scale), cv.width, pc.height, 0, 0, pc.width, pc.height);
            if (k > 0) pdf.addPage();
            pdf.addImage(pc.toDataURL('image/jpeg', 0.92), 'JPEG', MX, MT, PW - MX * 2, h / pxPerMm);
          }
          p = last; return step();
        });
      }
      return Promise.resolve(step()).then(function () { pdf.save(name + '.pdf'); });
    }).catch(function (e) {
      if (window.console) console.error(e);
      alert('PDF 파일을 바로 만들지 못해 인쇄 창을 엽니다. 대상(프린터)에서 ‘PDF로 저장’을 고르세요.');
      window.print();
    }).then(function () { window.scrollTo(sx, sy); busy(false); box.remove(); });
  }

  function run(kind, o) {
    var title = val(o.title) || document.title, name = safeName(val(o.name) || title), c;
    try { c = prepare(o); } catch (e) { alert(e.message); return; }
    if (kind === 'md') save(new Blob(['﻿' + toMd(c, title)], { type: 'text/markdown;charset=utf-8' }), name + '.md');
    else if (kind === 'doc') save(new Blob(['﻿' + toDoc(c, title)], { type: 'application/msword' }), name + '.doc');
    else if (kind === 'pdf') toPdf(c, name, o);
  }

  function mount(o) {
    addStyle();
    var host = val(o.host); if (typeof host === 'string') host = document.querySelector(host);
    var wrap = el('span', { 'class': 'bcx-wrap' + (o.menuDown ? ' down' : '') });
    if (!host) { wrap.className += ' bcx-float'; document.body.appendChild(wrap); }
    else if (o.prepend) host.insertBefore(wrap, host.firstChild); else host.appendChild(wrap);
    var btn = el('button', { type: 'button', 'class': 'bcx-btn' + (o.btnClass ? ' ' + o.btnClass : ''), 'aria-haspopup': 'true' }, o.label || '다운로드 ▾');
    var menu = el('div', { 'class': 'bcx-menu', role: 'menu' });
    menu.appendChild(el('p', null, '어떤 파일로 내려받을까요?'));
    [['md', 'MD', '#334155', 'Markdown (.md)', '노션·메모장에 붙여 넣기 좋아요'],
     ['doc', 'WORD', '#1d4ed8', 'Word (.doc)', '워드·한글에서 열어 고쳐 쓸 수 있어요'],
     ['pdf', 'PDF', '#dc2626', 'PDF (.pdf)', '제출·인쇄·공유용']].forEach(function (it) {
      var b = el('button', { type: 'button', role: 'menuitem' }, '<b style="background:' + it[2] + '">' + it[1] + '</b><span>' + it[3] + '<small>' + it[4] + '</small></span>');
      b.addEventListener('click', function () { wrap.classList.remove('open'); run(it[0], o); });
      menu.appendChild(b);
    });
    btn.addEventListener('click', function (e) { e.stopPropagation(); wrap.classList.toggle('open'); });
    document.addEventListener('click', function (e) { if (!wrap.contains(e.target)) wrap.classList.remove('open'); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') wrap.classList.remove('open'); });
    wrap.appendChild(menu); wrap.appendChild(btn);
    return { el: wrap, run: function (k) { run(k, o); }, remove: function () { wrap.remove(); } };
  }
  window.BCExport = { mount: mount, toMarkdown: function (o) { return toMd(prepare(o), val(o.title)); } };
})();
</script>
<script>
const PROMPT = "PT면접 시험지 메이커 v3 _ 영역별 문제 은행 → 문제 선택 → 내 답안 → 해설·첨삭 요청 (사이트에서 열어 보는 방식)\n\n[역할]\n당신은 PT면접 전문 AI 멘토입니다. 지원자의 기업·직무·전공·계열·산업 정보와 시간 설정으로, 현업 문제해결 과정이 드러나는 PT면접 문제 여러 개를 영역별로 만들어 '문제 은행 데이터(JSON)'로 출력합니다. 지원자가 문제를 풀고 '해설 요청'을 보내면, 그 문제의 해설과 첨삭을 '해설 데이터(JSON)'로 출력합니다. 지원자는 이 JSON을 방코치 사이트의 PT면접 페이지에 붙여 넣어 시험지로 봅니다.\n\n[대상]\n대기업·중견기업·스타트업 입사 준비자, 경력직 이직 준비자.\n\n[전체 진행 구조]\nSTEP 1  정보 입력 받기 (기업·직무·전공·계열·산업)\nSTEP 2  출제 범위 고르기 (영역별 골고루 / 특정 유형만)\nSTEP 3  시간 설정 받기 (작성 제한 시간, 발표 시간)\nSTEP 4  문제 은행 JSON 출력\nSTEP 5  사용 방법 안내\n해설 요청  사용자가 \"[PT 해설 요청]\"으로 시작하는 메시지를 보내면 그 문제의 해설 JSON만 출력\n\n[게이트 규칙]\n- 한 번에 한 STEP만 진행합니다. 질문은 한 번에 하나씩 하고, 답이 오면 다음으로 넘어갑니다.\n- JSON은 STEP 4와 해설 요청에서만 출력합니다.\n\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n[STEP 1] 먼저 이렇게 말하세요\n\"지원하실 기업명, 직무, 전공, 계열, 산업 분야를 입력해주세요.\n (계열 예: 인문·사회 / 상경·경영 / 이공·공학 / IT·SW / 자연과학 / 의약·보건 / 예체능·기타)\"\n- 부족한 항목만 다시 묻습니다. 계열을 모르면 전공으로 판단해 제안하고 확인받습니다. 경력직이면 연차도 한 번 묻습니다.\n\n[STEP 2] 이렇게 말하세요\n\"어떤 범위로 문제를 만들까요?\n 1) 영역별 골고루 (추천): 직무의 업무 영역 3개로 나눠 영역마다 2문제, 유형(일반형·상황형·전략형)을 섞어서 출제\n 2) 특정 유형만: 일반형 / 상황형 / 전략형 / 문제풀이형 중 하나\n ※ 문제풀이형은 계산·분석 풀이가 포함된 PT로, 설계·공정·품질·연구개발·반도체 등 이공계 일부 직무에서 출제됩니다. 모든 공학 직무에 있는 것은 아닙니다.\"\n- 이공·공학, IT·SW, 자연과학 계열이 1)을 고르면 영역 하나에 문제풀이형 1문제를 넣을지 한 번 묻습니다.\n- 문제 개수를 따로 말하면 따릅니다(최소 3개, 최대 8개).\n\n[STEP 3] 이렇게 말하세요\n\"시간을 정해주세요. 문제 분량과 발표 대본 길이가 이 시간에 맞춰집니다.\n ① 작성(준비) 제한 시간: 몇 분? (예: 10 / 20 / 30분, 기본 20분)\n ② 발표 시간: 몇 분? (예: 3 / 5 / 7 / 10분, 기본 5분)\"\n- 숫자만 답해도 됩니다. '기본'이면 작성 20분, 발표 5분입니다.\n\n[STEP 4] 문제 은행 JSON을 출력합니다 (아래 [문제 은행 형식])\n\n[STEP 5] JSON을 출력한 뒤 이렇게 안내하세요\n\"위 JSON 코드 블록 전체를 복사해 방코치 사이트 PT면접 페이지의 '문제 은행 붙여넣기'에 붙여 넣으세요.\n ① 영역별 문제 목록에서 풀고 싶은 문제를 고르고 → ② 시험지를 읽고 내 답안을 쓴 뒤 → ③ '해설 요청문 복사'를 눌러 이 채팅에 붙여 넣으면 → ④ 해설과 첨삭 JSON을 드립니다. 그 JSON을 다시 사이트에 붙여 넣으면 모범답안 비교·답변 방향·발표 시나리오가 열립니다.\"\n\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n■ 사고력이 드러나는 출제 원칙 (가장 중요)\nPT면접은 자료를 분석해 현업의 문제를 해결하는 과정을 보는 시험입니다. 질문은 단순하게, 자료는 생각하게 만듭니다.\n1. 질문은 한 문장으로 단순하게 씁니다. 예: \"어떤 선택을 하시겠습니까?\", \"무엇부터 해결하시겠습니까?\", \"이 제품의 판매를 어떻게 회복하시겠습니까?\" 어렵게 꼬거나 여러 개를 한꺼번에 묻지 않습니다.\n2. 대신 자료를 설계해서 분석력·추론·논리·근거·비판적 사고·창의적 사고·현업 문제해결 과정이 드러나게 합니다. 문제마다 아래 장치 중 3가지 이상을 자료 안에 넣습니다.\n   ① 결합해야 보이는 인사이트: 자료 하나만 보면 안 보이고, 두 자료의 숫자를 곱하거나 비교해야 핵심이 드러난다. (예: 채널 비중 × 채널별 재구매율)\n   ② 상충하는 신호: 한 자료는 A안을, 다른 자료는 B안을 가리켜 판단 기준을 세워야 한다.\n   ③ 표면 지표의 함정: 매출·만족도처럼 좋아 보이는 숫자 뒤에 이익률·재구매·불량 같은 다른 지표의 문제가 숨어 있다.\n   ④ 숨은 원인 단서: 고객 리뷰·현장 의견·VOC·내부 메모 한 줄에 근본 원인을 가리키는 단서가 있다.\n   ⑤ 정보의 빈틈: 결정에 필요한 정보 하나를 일부러 빼서, 가정을 세우거나 추가로 확인할 것을 말하게 한다.\n   ⑥ 현실 제약: 예산·기한·인력·규제·협력사 반발 등 실행을 가로막는 조건.\n3. 자료는 형식을 섞습니다: 수치 표, 현장 의견·VOC(따옴표 발언), 기사·개념 정리, 내부 메모. 표는 4~6행 정도로 핵심만 담습니다.\n4. 정답 하나를 맞히는 퀴즈가 아닙니다. 자료를 근거로 어떤 결론이든 논리적으로 설명할 수 있어야 합니다. (문제풀이형의 계산 값만 정답이 있습니다.)\n5. 출제 의도(각 자료가 보는 역량, 함정, 숨은 단서)는 문제 은행에 쓰지 않고 해설에서만 공개합니다. 자료 제목도 답을 암시하지 않게 중립적으로 씁니다. (예: '경쟁사 실패 사례'가 아니라 '경쟁 브랜드 할인 행사 결과')\n6. 문제마다 abilities에 이 문제에서 드러나는 역량 2~4개를 적습니다. (자료 결합 분석, 추론, 논리적 사고, 근거 제시, 비판적 사고, 창의적 사고, 문제해결 과정, 정량 분석, 이해관계자 조율 중에서)\n\n■ 영역 구성 규칙\n- 영역은 지원 직무의 실제 업무 영역으로 나눕니다. (예: 마케팅 → 고객·시장 분석 / 채널·운영 의사결정 / 브랜드·전략 기획. 공정·품질 → 품질 데이터 분석 / 공정 개선 의사결정 / 협업·운영 관리)\n- 영역마다 이름과 한 줄 설명(desc)을 씁니다. 같은 영역의 두 문제는 상황과 쟁점이 겹치지 않게 합니다.\n- 문제 id는 영역 문자 + 번호(A1, A2, B1, …)로 씁니다.\n\n■ 계열 반영\n이공·공학/IT·SW/자연과학은 기술·공정·데이터·정량 근거 중심, 인문·사회는 정책·고객·조직, 상경·경영은 시장·재무·마케팅, 의약·보건은 환자·규정·안전 소재로 구성합니다.\n\n■ 유형별 규칙\n[일반형] 직무 문제·트렌드·전공 지식을 연결한 주제. options는 [], solve는 null.\n[상황형] 갈등·의사결정 시나리오. 선택지 options 정확히 3개(A·B·C), 서로 정면으로 대치되고 각 desc는 3문장 이상, 조건·관점 차이를 자세히. 어느 쪽을 골라도 장단점이 뚜렷해 선택이 어렵게.\n[전략형] 시장 데이터 기반 해결방안·기획안. 자사 현황, 현재 문제점, 시장·경쟁 데이터(표 1개 이상), 기사·개념이 해결 과정에 실제로 쓰이게. options는 [].\n[문제풀이형] 계산·분석 풀이가 핵심. 학부 수준 난이도. solve에 title, problem((1)(2)(3)으로 구할 것), given(조건·상수·확률표 값), formulas(필요 공식 2~4개)를 씁니다. 풀이 과정과 정답은 해설에서만 공개합니다. 수식은 LaTeX 없이 일반 글자와 유니코드(×, ÷, ², √, Δ, ≈)로 씁니다. 계산 값은 반드시 직접 두 번 검산합니다.\n\n■ 시간 반영 규칙\n- 작성 제한 시간(prepTime): 10분 이하 자료 3개, 11~20분 자료 3~4개, 21분 이상 자료 4~5개. 읽고 풀 수 있는 분량이어야 합니다.\n- 발표 시간(speechTime): 해설의 발표 시나리오 script 글자 수 합계(자문자답 [[ ]] 표시 제외)를 speechTime × 330자의 ±15%로 맞춥니다.\n\n■ 데이터 정직성 규칙\n- 확인된 사실만 사실로 씁니다. 검색 가능한 AI는 출처(기관·매체·연도)를 적고 status를 \"출처 확인\"으로 둡니다.\n- 확인되지 않은 수치·기사·사례는 실제처럼 쓰지 않습니다. 가상 자료는 \"가상 자료\", 불확실하면 \"확인 필요\", 일반 개념은 \"개념 정리\"로 두고 source에 \"가상(연습용)\" 등을 밝힙니다.\n- 실제 기업의 내부 수치는 지어내지 않습니다. 지원 기업은 회사명 뒤에 '(가상 상황)'을 붙인 가상 사례로 출제해도 됩니다.\n- 기출 근거(basis)는 \"출제될 수 있는 산업·기업 이슈\"로 쓰고 실제 기출이라고 단정하지 않습니다.\n\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n[해설 요청 처리]\n사용자가 \"[PT 해설 요청]\"으로 시작하는 메시지를 보내면, 메시지에 들어 있는 문제와 내 답안을 읽고 아래 [해설 형식] JSON 하나만 출력합니다.\n- 해설은 그 문제의 자료를 근거로 씁니다. 출제 의도(intent)에는 각 자료가 어떤 역량을 보는지, 숨은 단서와 함정이 무엇인지 공개합니다.\n- feedback(첨삭): 사용자 답안을 읽고 잘한 점 2~3개, 고칠 점 2~3개(어느 칸의 무엇을 어떻게), 해결방안 PREP 첨삭(prep), 해결방안을 다시 쓴 예시 한 문단을 씁니다. 답안이 비어 있으면 feedback은 null.\n- prep: 사용자의 해결방안 칸을 PREP(P 결론 → R 이유 → E 근거 → P2 재강조) 관점으로 진단합니다. 단계마다 '내 해결방안에서 해당하는 부분(없으면 (없음))'과 '이렇게 다듬어 보세요'를 씁니다. 해결방안이 여러 개라면 가장 앞세울 방안을 결론으로 세우고 나머지는 근거·실행 순서로 정리하게 안내합니다.\n- 모범답안 model은 4칸: C 문제점 및 현황 분석 / S 해결방안 / F 기대효과(지표·기간) / L 남아있는 문제점(한계·보완책·중단 기준). PT의 해결방안은 하나가 아닐 수 있으므로 S에는 해결방안을 1~3개, 번호(①②③)를 붙여 우선순위대로 쓰고, 방안마다 자료의 수치·단서(문제풀이형은 계산 결과)를 근거로 붙이고 실행 방법(예산·일정·역할)을 씁니다.\n- 발표 시나리오는 구어체 실전 발표처럼, 스토리텔링(장면·숫자·고객 한 명의 이야기로 시작)과 자문자답([[ ]]로 감쌈), 비즈니스 통찰을 담습니다. 개조식 금지. 8구간: 오프닝 → 서론(주제의 중요성) → 목차 소개 → 본론 1 → 본론 2 → 본론 3 → 요약 및 정리 → 마무리 멘트. 본론 1은 문제점 및 현황 분석, 본론 2는 해결방안(방안이 여러 개면 우선순위대로, 방안마다 근거와 실행 방법), 본론 3은 기대효과와 남아있는 문제점. 구간 이름은 '본론 1 — …'처럼 '본론'으로 시작합니다.\n- scenario[].prep 태그: 오프닝·목차·마무리 [], 서론 [\"P\"](결론을 먼저 말함), 본론 1 [\"C\"], 본론 2 [\"S\"], 본론 3 [\"F\",\"L\"], 요약 [\"P2\"](결론 재강조).\n- direction은 C, (문제풀이형이면 V), S, F, L 순서. 칸마다 frame(말하기 틀, 빈칸은 ○○)을 넣습니다. S의 guide에는 자료 → 근거 → 실행안으로 해결방안을 세우는 법과, 여러 방안의 우선순위를 정하는 기준을 씁니다.\n\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n[출력 규칙]\n- JSON은 ```json 코드 블록 하나로만 출력하고, 앞뒤에 짧은 안내 한두 줄만 씁니다.\n- 유효한 JSON이어야 합니다. 문자열 안에 큰따옴표(\")를 쓰지 말고 ‘ ’ 또는 「 」를 씁니다. 줄바꿈은 \\n. 마지막 항목 뒤 쉼표 금지. 해당 없는 값은 [] 또는 null.\n- 출력 전에 점검: ① 문제마다 사고력 장치 3가지 이상 ② 질문이 한 문장으로 단순한가 ③ 자료 제목이 답을 암시하지 않는가 ④ 상황형 선택지 3개 ⑤ 가상·미확인 자료 표시 ⑥ 문제풀이형 계산 검산 ⑦ (해설)  인식 훼손"},{"label":"B","title":"자사몰 구독 전환에 예산 집중","desc":"체험 쿠폰과 구독 혜택으로 첫 구매 고객을 자사몰 정기 구독으로 전환시키는 안입니다.\n구독 고객의 재구매율이 가장 높고 고객 데이터를 직접 확보해 이후 개선에 쓸 수 있다는 장점이 있습니다.\n하지만 현재 자사몰 비중이 20%에 불과해 효과가 나기까지 시간이 걸리고, 대형마트와의 관계에서 ‘우리를 외면한다’는 불만이 생길 수 있습니다.","pro":"재구매율 직접 개선, 고객 데이터 확보","con":"초기 규모가 작음, 유통 파트너 갈등 가능성"},{"label":"C","title":"제품 리뉴얼 후 재출시(예산 보류)","desc":"리뷰에서 반복되는 ‘양이 적다’ 의견을 반영해 용량과 레시피를 개선한 뒤 마케팅을 재개하는 안입니다.\n제품 만족도라는 근본 원인을 해결해 장기적으로 가장 단단한 구조를 만들 수 있습니다.\n그러나 리뉴얼과 재출시에 최소 두 달 이상이 걸려 그동안 매대 점유율과 경쟁사 대비 노출을 잃을 위험이 크고, 이번 분기 성과를 요구하는 경영진을 설득하기 어렵습니다.","pro":"근본 원인 해결, 장기 만족도 상승","con":"최소 2개월 공백, 분기 성과 부재"}],"materials":[{"kind":"자사현황","title":"한끼정식 출시 첫 달 성과","status":"가상 자료","body":"- 판매량: 목표 대비 110%\n- 재구매율: 18% (목표 30%)\n- 구매 채널 비중: 대형마트 70%, 자사몰 20%, 기타 10%\n- 리뷰 평점 3.9/5.0 (‘양이 적다’ 의견 41%)","table":null,"source":"가상 내부 자료(연습용)"},{"kind":"시장데이터","title":"채널별 재구매율 비교","status":"가상 자료","body":"","table":{"headers":["채널","구매 비중","재구매율","평균 객단가"],"rows":[["대형마트","70%","12%","7,900원"],["자사몰(일반)","15%","24%","9,500원"],["자사몰(정기 구독)","5%","58%","8,700원"],["기타","10%","15%","8,200원"]]},"source":"가상 내부 자료(연습용)"},{"kind":"문제점","title":"경쟁 브랜드 할인 6주 연속 진행 사례","status":"가상 자료","body":"경쟁 브랜드가 6주간 연속 할인을 진행한 뒤 정가로 복귀하자 판매량이 행사 전보다 낮아졌습니다. 가격에 반응해 구매한 고객은 정가 구매로 이어지지 않는 경향을 보였습니다.","table":null,"source":"가상 사례(연습용)"},{"kind":"개념","title":"LTV와 CAC","status":"개념 정리","body":"고객 생애가치(LTV)는 한 고객이 거래 기간 동안 가져다주는 총수익, 고객 획득 비용(CAC)은 새 고객 한 명을 얻는 데 드는 비용입니다. 일반적으로 LTV/CAC가 3 이상이면 건강한 구조로 봅니다.","table":null,"source":"일반 마케팅 개념"}],"solve":null,"basis":[{"kind":"산업","text":"식품업계는 간편식 시장 경쟁이 심해지면서 신제품의 초기 재구매율을 성패 지표로 보는 경향이 있습니다.(출제 가능 이슈 예시)"},{"kind":"기업","text":"식품 기업의 마케팅 직무 PT에서는 한정된 예산으로 채널·가격·제품 중 무엇에 집중할지 묻는 상황형이 자주 출제됩니다.(예시)"}]},{"id":"B2","type":"상황형","title":"명절 물량이 부족합니다. 어느 채널에 먼저 공급하시겠습니까?","summary":"설비 점검으로 명절 생산량이 줄어든 상황에서, 세 채널 중 어디에 우선 공급할지 정하고 나머지 채널 대응까지 제시하는 문제입니다.","abilities":["정량 분석","이해관계자 조율","창의적 사고"],"situation":"설 명절 2주 전, 공장 설비 점검으로 한끼정식 생산량이 계획보다 30% 줄었습니다. 계획 물량 10만 개 중 7만 개만 공급할 수 있습니다.\n대형마트, 온라인몰, 자사몰 모두 명절 기획전을 준비 중이며 각자 물량 보장을 요구합니다.\n공장 정상화 시점은 아직 확정되지 않았습니다.","task":"세 채널 중 우선 공급할 곳을 정하고, 나머지 채널 대응 방안을 함께 제시하세요.","options":[{"label":"A","title":"대형마트 행사 물량 우선","desc":"매출 비중이 가장 큰 대형마트 명절 행사 물량을 먼저 맞추는 안입니다.\n행사 매대를 지켜 두면 명절 이후 정상 매대 위치에도 유리합니다.\n다만 온라인·자사몰 고객은 품절을 겪고, 마트 행사는 할인 폭이 커서 남는 이익이 적습니다.","pro":"매출 규모 유지, 유통 관계 보호","con":"이익 적음, 온라인·충성 고객 품절"},{"label":"B","title":"온라인몰 기획전 우선","desc":"명절 기간 검색과 구매가 몰리는 온라인몰 기획전에 집중하는 안입니다.\n노출 효과가 크고 새로운 고객이 많이 들어옵니다.\n하지만 판매 수수료가 높고 배송 마감이 빨라, 물량을 늦게 넣으면 오히려 품절 불이익을 받을 수 있습니다.","pro":"신규 고객 유입, 노출 효과","con":"수수료 부담, 마감 리스크"},{"label":"C","title":"자사몰·구독 고객 우선","desc":"구독 고객과 자사몰 주문을 먼저 지켜 충성 고객 이탈을 막는 안입니다.\n개당 이익이 가장 크고 구독 해지를 막을 수 있습니다.\n하지만 물량이 작아 전체 매출 공백이 크고, 대형마트와의 연간 행사 약속을 어기게 될 수 있습니다.","pro":"이익률 최고, 충성 고객 보호","con":"매출 공백, 마트와 약속 위반 우려"}],"materials":[{"kind":"시장데이터","title":"채널별 명절 판매 계획","status":"가상 자료","body":"","table":{"headers":["채널","계획 물량","개당 공헌이익","품절 시 불이익"],"rows":[["대형마트","60,000개","900원","다음 분기 행사 배정 축소"],["온라인몰","30,000개","1,300원","검색 노출 순위 하락"],["자사몰·구독","10,000개","2,100원","구독 해지 위험"]]},"source":"가상(연습용)"},{"kind":"내부메모","title":"구독 고객 현황","status":"가상 자료","body":"- 구독 고객 2,400명, 월 평균 2.1회 주문\n- 지난 추석 배송 지연 때 구독 해지율이 평소의 3배로 늘었음","table":null,"source":"가상(연습용)"},{"kind":"현장의견","title":"대형마트 바이어 메일 중 일부","status":"가상 자료","body":"‘명절 행사 물량이 빠지면 3월 신학기 행사 매대는 다른 브랜드에 줄 수밖에 없습니다. 다만 행사 기간 안에서 물량을 나눠 넣는 것은 협의할 수 있습니다.’","table":null,"source":"가상(연습용)"}],"solve":null,"basis":[{"kind":"기업","text":"식품 기업 영업·마케팅 직무에서 공급 차질 시 채널 우선순위를 묻는 상황형이 나올 수 있습니다.(예시)"}]}]},{"id":"C","name":"전략·기획","desc":"중장기 투자 방향을 데이터로 설득하는 일","problems":[{"id":"C1","type":"전략형","title":"한끼정식의 내년 마케팅 예산, 어디에 투자하시겠습니까?","summary":"매출은 늘었지만 적자가 커지는 상황에서, 실적·유입 경로·고객 인터뷰 자료를 엮어 내년 마케팅 투자 방향을 기획안으로 제안하는 문제입니다.","abilities":["비판적 사고","정량 분석","문제해결 과정"],"situation":"출시 1년 차 한끼정식의 매출은 분기마다 늘었습니다. 그러나 영업이익은 계속 적자입니다.\n경영진은 내년 마케팅 예산 10억 원을 어디에 쓸지 기획안을 요구했습니다.","task":"내년 마케팅 투자 방향을 하나 정해 기획안으로 제안하세요.","options":[],"materials":[{"kind":"자사현황","title":"분기별 실적","status":"가상 자료","body":"","table":{"headers":["분기","매출","광고비","영업이익"],"rows":[["1분기","12억 원","2.0억 원","-1.8억 원"],["2분기","18억 원","3.5억 원","-2.1억 원"],["3분기","25억 원","5.2억 원","-2.6억 원"],["4분기","31억 원","7.4억 원","-3.3억 원"]]},"source":"가상(연습용)"},{"kind":"시장데이터","title":"유입 경로별 고객 성과","status":"가상 자료","body":"","table":{"headers":["유입 경로","신규 고객 비중","6개월 뒤 남은 비율","고객 1명 획득 비용"],"rows":[["검색 광고","35%","22%","18,000원"],["SNS 숏폼","40%","9%","11,000원"],["지인 추천","12%","41%","6,000원"],["매장 시식","13%","30%","14,000원"]]},"source":"가상(연습용)"},{"kind":"현장의견","title":"고객 인터뷰 요약","status":"가상 자료","body":"- 재구매 고객: ‘친구가 맛있다고 해서 사 봤어요’라는 답이 가장 많음\n- 이탈 고객: ‘광고 보고 샀는데 생각보다 평범했다’는 답이 많음","table":null,"source":"가상(연습용)"},{"kind":"개념","title":"고객 생애가치와 획득 비용","status":"개념 정리","body":"고객 한 명이 남기는 이익(생애가치)이 그 고객을 데려오는 비용보다 커야 마케팅이 이익을 만듭니다. 오래 남는 고객일수록 생애가치가 커집니다.","table":null,"source":"일반 마케팅 개념"}],"solve":null,"basis":[{"kind":"산업","text":"성장기 브랜드가 광고 의존을 줄이고 수익 구조를 만드는 방안은 자주 다뤄지는 이슈입니다.(출제 가능 이슈 예시)"}]},{"id":"C2","type":"일반형","title":"자사몰에 AI 추천을 도입한다면, 무엇부터 하시겠습니까?","summary":"대표의 AI 추천 도입 지시를 받고, 자사 데이터 현황과 경쟁사 사례를 따져 가장 먼저 할 일과 단계별 계획을 제안하는 문제입니다.","abilities":["비판적 사고","문제해결 과정","창의적 사고"],"situation":"경쟁사가 AI 개인화 추천으로 자사몰 객단가를 크게 높였다는 기사가 나왔습니다. 대표는 ‘우리도 AI 추천을 바로 도입하라’고 지시했습니다.\n마케팅팀이 이 과제를 맡았습니다.","task":"AI 추천 도입을 위해 가장 먼저 할 일과 단계별 계획을 제안하세요.","options":[],"materials":[{"kind":"기사","title":"경쟁사 AI 추천 도입 기사 요약","status":"가상 자료","body":"경쟁사 B사는 AI 추천 도입 후 자사몰 객단가가 18% 올랐다고 밝혔습니다. B사 자사몰 회원은 120만 명이며, 도입 전 데이터 정비에만 1년이 걸렸다고 합니다.","table":null,"source":"가상(연습용)"},{"kind":"자사현황","title":"자사몰 데이터 현황","status":"가상 자료","body":"- 회원 3.2만 명, 월 구매 회원 4,100명\n- 구매 이력 2년치 보관, 상품 클릭·장바구니 기록은 수집하지 않음\n- 마케팅 활용 동의 회원 비율 38%","table":null,"source":"가상(연습용)"},{"kind":"시장데이터","title":"자사몰 구매 패턴","status":"가상 자료","body":"","table":{"headers":["항목","값"],"rows":[["1회 주문 평균 품목 수","1.4개"],["가장 많이 함께 산 조합","한끼정식 + 만두 (23%)"],["재주문 때 같은 상품을 다시 산 비율","71%"]]},"source":"가상(연습용)"},{"kind":"개념","title":"개인정보 활용 동의","status":"개념 정리","body":"맞춤 추천·광고에 고객 정보를 쓰려면 그 목적에 맞는 동의가 필요하며, 동의하지 않은 고객의 정보는 개인화에 쓸 수 없습니다.","table":null,"source":"일반 개념(세부 사항은 개인정보보호법 확인 필요)"}],"solve":null,"basis":[{"kind":"산업","text":"유통·식품 기업의 자사몰 개인화와 데이터 활용은 디지털 전환 이슈로 자주 다뤄집니다.(출제 가능 이슈 예시)"}]}]}]},"solutions":{"B1":{"kind":"pt-solution","problemId":"B1","intent":{"summary":"판매량 110%라는 좋은 숫자 뒤에 숨은 재구매 문제를 알아보는지, 그리고 비중은 작지만 재구매율이 높은 채널을 숫자로 찾아내는지를 봅니다. 할인 요구라는 쉬운 답을 경쟁사 사례로 걸러낼 수 있는지도 확인합니다.","materials":[{"ref":0,"insight":"재구매 이탈의 원인이 ‘가격’보다 ‘만족도(양)’에 있을 가능성","tests":"비판적 사고 · 추론","trap":"표면 지표의 함정: 판매 110%는 합격점처럼 보이지만 재구매 18%가 진짜 문제. 리뷰 41% ‘양이 적다’는 숨은 원인 단서","keywords":["재구매","18%","양"]},{"ref":1,"insight":"구독 고객의 재구매율이 대형마트의 약 5배이지만, 비중은 5%에 불과","tests":"자료 결합 분석 · 정량 분석","trap":"결합해야 보이는 인사이트: 구독 비중 5%만 보면 작지만 재구매율 58%와 함께 보면 가장 키울 곳","keywords":["구독","58%","자사몰"]},{"ref":2,"insight":"A안(할인)의 최대 리스크를 보여주는 반례","tests":"비판적 사고","trap":"상충하는 신호: 대형마트 요구(할인)와 반대 방향을 가리키는 반례","keywords":["할인","프로모션","정가"]},{"ref":3,"insight":"세 선택지를 비교하는 공통 판단 기준으로 활용","tests":"논리적 사고 · 근거 제시","trap":"판단 기준을 세우게 하는 개념 자료","keywords":["LTV","CAC","생애가치"]}]},"feedback":{"summary":"아래는 가상의 수험생 답안(‘할인과 구독을 둘 다 하겠다’)을 기준으로 한 첨삭 예시입니다. 문제 현황을 숫자로 잡은 점은 좋지만, 해결방안이 두 개로 나뉘면서 우선순위와 근거가 흐려졌습니다.","good":["판매량 110%와 재구매율 18%를 함께 써서 문제를 정확히 짚었습니다.","대형마트와의 관계라는 현실 제약을 언급했습니다."],"fix":["해결방안: 할인과 구독을 함께 하려면 3억 원을 어떻게 나눌지, 무엇이 먼저인지 밝혀야 합니다.","해결방안: 경쟁 브랜드 할인 사례(자료 3)를 쓰지 않아 할인의 위험을 설명하지 못했습니다.","기대효과: ‘재구매율이 오를 것’이 아니라 기간과 목표 수치로 쓰세요."],"prep":[{"step":"P","mine":"할인과 구독을 둘 다 진행하겠습니다.","suggest":"우선순위를 담아 한 문장으로: ‘3억 원 중 2.5억 원을 구독 전환에 먼저 쓰겠습니다.’"},{"step":"R","mine":"두 채널 모두 중요하기 때문입니다.","suggest":"문제 현황과 연결: ‘문제는 판매가 아니라 재구매이고, 재구매를 직접 만드는 장치가 구독이기 때문입니다.’"},{"step":"E","mine":"(근거 없음)","suggest":"자료 2의 구독 재구매율 58%와 자료 3의 할인 후 판매 감소 사례를 나란히 놓고, 예산 배분을 이어서 말하세요."},{"step":"P2","mine":"(재강조 없음)","suggest":"‘가격을 깎아 한 번 더 파는 대신 관계를 만드는 데 투자하겠습니다’처럼 처음 결론으로 닫으세요."}],"rewrite":"저는 3억 원을 자사몰 구독 전환에 집중하겠습니다. 지금 문제는 판매가 아니라 재구매이고, 재구매를 가장 직접적으로 만드는 장치가 구독이기 때문입니다. 구독 고객의 재구매율은 58%로 대형마트 12%의 약 5배인 반면, 경쟁 브랜드는 6주 할인 뒤 정가로 돌아가자 판매가 오히려 줄었습니다. 그래서 구독 혜택에 1.8억, 마트 고객의 자사몰 유도에 0.7억, 용량 옵션 테스트에 0.5억을 쓰겠습니다. 가격을 깎는 대신 관계를 만드는 데 투자하겠습니다."},"model":{"choice":"B","choiceReason":"재구매율이라는 핵심 문제를 가장 직접적으로 풀고, 근거 데이터가 가장 분명한 선택지이기 때문입니다.","C":"출시 첫 달 판매량은 목표의 110%지만 재구매율은 18%로 목표 30%에 크게 못 미칩니다. 대형마트 구매 고객의 재구매율은 12%에 그치고, 리뷰의 41%는 ‘양이 적다’고 말합니다. 지금 문제는 팔리지 않는 것이 아니라 다시 사지 않는 것이며, 원인은 가격보다 만족도와 고객과의 관계 부재에 가깝다고 진단합니다.","S":"저는 B안, 자사몰 구독 전환에 3억 원을 집중하겠습니다. 지금 문제는 팔리지 않는 것이 아니라 다시 사지 않는 것이고, 재구매를 만드는 가장 직접적인 장치가 구독이기 때문입니다. 자사몰 구독 고객의 재구매율은 58%로 대형마트 12%의 약 5배입니다. 반대로 경쟁사는 6주 연속 할인 뒤 정가 복귀 시 판매가 행사 전보다 줄었습니다. 따라서 3억 원을 구독 혜택과 첫 구매 체험 쿠폰 1.8억, 대형마트 구매 고객의 자사몰 유도 0.7억, 1.2배 용량 옵션 테스트와 만족도 조사 0.5억으로 배분합니다.","F":"8주 뒤 구독 전환율 10%, 전체 재구매율 25%를 목표로 합니다. 구독 고객이 늘수록 객단가와 LTV가 함께 오르고, 쌓인 고객 데이터로 이후 제품 개선과 광고 효율도 높일 수 있습니다.","L":"자사몰 비중이 20%라 단기 매출 규모는 작고, 대형마트가 소외됐다고 느낄 수 있습니다. 마트 판매 구성과 가격대를 구독 상품과 다르게 가져가 갈등을 줄이고, 8주 뒤 지표가 미달이면 C안 리뉴얼 검증으로 전환하는 중단 기준을 두겠습니다."},"solveAnswer":null,"checklist":[{"item":"첫 문장에서 선택지 하나를 분명히 골랐다","why":"결론을 먼저 말해야 평가자가 이후 설명을 근거로 따라갑니다."},{"item":"문제 현황을 숫자로 정의했다(무엇이 얼마나 문제인가)","why":"진단이 흐릿하면 해결방안이 설득력을 잃습니다."},{"item":"고르지 않은 두 선택지를 버린 이유를 설명했다","why":"상황형은 선택 자체보다 ‘왜 나머지는 아닌가’를 평가합니다."},{"item":"해결방안마다 자료의 수치·단서를 근거로 붙이고, 우선순위와 실행 방법을 말했다","why":"해결방안이 여러 개일수록 근거와 순서가 있어야 설득됩니다."},{"item":"기대효과를 측정 가능한 목표(지표·기간)로 말했다","why":"‘좋아질 것’이 아니라 ‘8주 뒤 25%’처럼 말해야 검증이 됩니다."},{"item":"남은 문제점과 보완책·중단 기준을 먼저 말했다","why":"한계를 먼저 말하는 지원자가 더 신뢰받습니다."}],"direction":[{"step":"C","title":"문제점 및 현황 분석 — 무엇이 얼마나 문제인가","guide":"판매량은 합격점이고 재구매가 문제라는 진단이 핵심입니다. 숫자 두 개를 대비시켜 문제를 한 문장으로 정의하세요.","frame":"판매는 ○○%인데 재구매는 ○○%입니다. 원인은 가격이 아니라 ○○로 보입니다.","refs":[0,1],"how":"110% vs 18%를 나란히 놓고, 원인을 가격이 아닌 만족·관계로 좁히기","mistake":"가격이 문제라고 단정해 할인 쪽으로 곧장 가는 것"},{"step":"S","title":"해결방안 — 자료 → 근거 → 실행안","guide":"해결방안은 여러 개여도 됩니다. 각 방안마다 자료의 숫자·단서를 근거로 붙이고, 무엇을 먼저 할지 우선순위와 실행 방법(예산·일정·역할)을 함께 씁니다. 선택한 안을 밀어주는 숫자와 버린 안을 막는 숫자를 함께 씁니다. 그다음 예산 배분과 실행 순서로 이어서, 근거가 곧 실행안이 되게 하세요.","frame":"(자료 수치)이므로 ○안이 맞고, 반대로 ○안은 (반례) 때문에 어렵습니다. 그래서 예산은 ○○에 ○억, ○○에 ○억을 씁니다.","refs":[0,3,1,2],"how":"채널별 재구매율 표 → 경쟁 할인 사례 → 양 불만 41% → 예산 배분 순서","mistake":"자료를 읽어주기만 하고 ‘그래서 어떻다’를 말하지 않는 것"},{"step":"F","title":"기대효과 — 측정 가능한 목표","guide":"실행하면 무엇이 얼마나 바뀌는지를 지표와 기간으로 말합니다. 단기 효과와 장기 효과를 나누면 더 좋습니다.","frame":"○주 뒤 ○○를 ○%에서 ○%로 높이고, 장기적으로는 ○○가 쌓입니다.","refs":[3],"how":"LTV 관점의 장기 효과 + 8주 목표 수치","mistake":"‘매출이 오를 것’처럼 막연하게 쓰는 것"},{"step":"L","title":"남아있는 문제점 — 한계와 보완책","guide":"해결되지 않는 한계를 스스로 먼저 말하고, 보완책과 중단 기준을 붙입니다.","frame":"다만 ○○라는 한계가 남습니다. 이를 ○○로 보완하고, ○○에 미달하면 ○○로 전환하겠습니다.","refs":[1],"how":"한계 1개 + 보완책 + 미달 시 전환 기준","mistake":"리스크를 말하지 않고 ‘잘될 것’으로 끝내는 것"}],"scenario":[{"name":"오프닝 멘트","prep":[],"minutes":0.7,"script":"안녕하십니까, 마케팅팀 지원자 ○○○입니다. [[한 가지 장면부터 말씀드리겠습니다.]] 출시 3주 차, 한끼정식은 목표의 110%를 팔았습니다. 박수가 나올 법한 숫자인데, 그 옆의 숫자 하나가 우리를 불편하게 합니다. 재구매율 18%입니다. 열 명이 사 갔는데 두 명도 다시 오지 않았다는 뜻입니다.","connector":"","check":"처음 30초 안에 ‘왜 이 이야기를 듣는지’가 전해졌는가?"},{"name":"서론 — 주제의 중요성","prep":["P"],"minutes":1,"script":"신제품의 첫 달은 ‘팔렸는가’를 보는 시간이지만, 두 번째 달부터는 ‘다시 샀는가’를 보는 시간입니다. 지금 이 숫자를 방치하면 한끼정식은 한 번 먹어 보고 마는 제품이 됩니다. 그렇게 되면 이미 쓴 출시 비용도 회수하기 어렵습니다. [[그래서 오늘 제 결론은 무엇일까요?]] 이번 분기 추가 예산 3억 원 전부를 B안, 자사몰 구독 전환에 쓰겠습니다.","connector":"첫 숫자 이야기를 받아, 그래서 무엇이 중요한지와 결론으로 넘어갑니다.","check":"선택(B안)과 예산 규모가 이 구간 안에 나왔는가?"},{"name":"목차 소개","prep":[],"minutes":0.6,"script":"발표는 세 가지 순서로 말씀드리겠습니다. 첫째, 지금 무엇이 문제인지 문제 현황. 둘째, 세 가지 선택지를 데이터로 비교한 해결방안. 셋째, 기대효과와 아직 남는 문제점입니다. 결론은 이미 말씀드렸으니 근거를 따라와 주시면 됩니다.","connector":"결론을 먼저 말했으니, 그 결론을 어떤 순서로 뒷받침할지 길을 안내합니다.","check":"목차 3개가 이후 본론 1·2·3과 정확히 대응하는가?"},{"name":"본론 1 — 문제 현황","prep":["C"],"minutes":1.2,"script":"첫째, 문제 현황입니다. 110%와 18%, 이 두 숫자는 같은 이야기의 다른 장면입니다. [[사람들은 샀는데, 왜 다시 사지 않았을까요?]] 먼저 채널을 보면 대형마트 구매 고객의 재구매율은 12%에 그칩니다. 리뷰를 보면 ‘양이 적다’는 의견이 41%입니다. 값이 비싸서가 아니라 만족이 모자라서, 그리고 다시 만날 접점이 없어서 돌아서고 있다는 신호입니다. 그렇다면 해법은 가격을 깎는 쪽이 아니라 관계를 이어가는 쪽에 있어야 합니다.","connector":"첫째로 문제를 재정의하며, ‘가격이 아니라 관계’라는 방향을 다음 비교의 기준으로 넘깁니다.","check":"‘진짜 문제’가 가격이 아니라 재구매라는 점이 한 문장으로 명확한가?"},{"name":"본론 2 — 해결방안","prep":["S"],"minutes":1.9,"script":"둘째, 해결방안입니다. 결론부터 말씀드리면 B안, 자사몰 구독 전환입니다. [[왜 구독일까요?]] 지금 문제는 팔리지 않는 것이 아니라 다시 사지 않는 것이고, 재구매를 만드는 가장 직접적인 장치가 구독이기 때문입니다. 근거를 보겠습니다. 구독 고객의 재구매율은 58%로 대형마트의 약 다섯 배입니다. 반대로 A안 할인은 경쟁사가 6주 연속 할인한 뒤 정가로 돌아오자 판매가 행사 전보다 줄었고, C안 리뉴얼은 최소 두 달의 공백이 생깁니다. 그래서 3억 원은 구독 혜택과 체험 쿠폰에 1.8억, 마트 구매 고객의 자사몰 유도에 0.7억, 1.2배 용량 옵션 테스트와 만족도 조사에 0.5억을 씁니다. 다시 말해 가격을 깎는 대신 관계를 만드는 방법입니다.","connector":"앞에서 정의한 ‘재구매’ 문제를 받아, 해결방안과 그 근거, 실행 순서를 말합니다.","check":"해결방안마다 자료 근거와 실행 방법이 붙어 있는가?"},{"name":"본론 3 — 기대효과와 남은 문제점","prep":["F","L"],"minutes":1.7,"script":"셋째, 기대효과와 남은 문제점입니다. 8주 뒤 목표는 구독 전환율 10%, 전체 재구매율 25%입니다. 구독 고객이 늘면 객단가와 고객 생애가치가 함께 오르고, 쌓인 고객 데이터는 다음 제품 개선에도 쓸 수 있습니다. [[그럼 이 안에는 약점이 없을까요?]] 있습니다. 자사몰 비중이 20%라 단기 매출 규모는 크지 않고, 대형마트는 소외됐다고 느낄 수 있습니다. 그래서 마트에는 구독 상품과 다른 구성과 가격대를 유지해 충돌을 줄이겠습니다. 그리고 8주 뒤 목표에 미달하면 C안 리뉴얼 검증으로 바로 전환한다는 중단 기준을 미리 정해 두겠습니다.","connector":"고른 안을 숫자로 약속한 뒤, 가장 걱정될 만한 약점을 스스로 먼저 꺼내 보완책으로 닫습니다.","check":"기대효과 수치와 남은 문제점·보완책·중단 기준이 모두 들어갔는가?"},{"name":"요약 및 정리","prep":["P2"],"minutes":1,"script":"정리하겠습니다. 문제는 판매가 아니라 재구매였고, 그 재구매를 가장 크게 만든 곳이 구독이었습니다. 그래서 가격을 깎아 한 번 더 파는 대신, 구독으로 관계를 만들어 고객 한 명의 가치를 키우겠습니다. 첫 8주 목표는 구독 전환율 10%, 재구매율 25%이고, 미달하면 C안으로 전환하겠습니다.","connector":"본론 세 가지를 한 줄씩 되짚으며 처음 결론과 같은 문장으로 돌아옵니다.","check":"처음의 결론 문장과 마지막 결론 문장이 같은 방향인가?"},{"name":"마무리 멘트","prep":[],"minutes":0.5,"script":"출시 한 달의 110%는 시작일 뿐이었습니다. 이제 한끼정식을 다시 찾는 제품으로 만드는 일을 맡겨주신다면, 8주 안에 숫자로 보여드리겠습니다. 경청해 주셔서 감사합니다.","connector":"오프닝의 숫자 이야기를 다시 꺼내 이야기 전체를 닫습니다.","check":"오프닝의 장면과 마무리가 이어져 한 이야기처럼 느껴지는가?"}]}}},"b":{"name":"공정·품질 (한빛전자)","bank":{"kind":"pt-bank","meta":{"company":"한빛전자(가상 상황)","job":"공정·품질 엔지니어","major":"산업공학","field":"이공·공학","industry":"전자부품 제조","role":"품질관리팀 신입 엔지니어","prepTime":20,"speechTime":4},"areas":[{"id":"A","name":"품질 데이터 분석","desc":"품질 숫자를 계산하고 그 의미를 따져 보는 일","problems":[{"id":"A1","type":"문제풀이형","title":"두께 규격 상한 초과 불량, 공정능력으로 진단하고 개선안을 제시하시오","summary":"고객사 클레임이 발생한 부품의 두께 데이터를 바탕으로 공정능력지수(Cp, Cpk)와 불량률을 직접 계산하고, 그 결과로 개선 방향과 기대효과, 남는 문제점까지 발표하는 문제풀이형 PT입니다.","abilities":["정량 분석","논리적 사고","문제해결 과정"],"situation":"한빛전자는 스마트폰용 금속 부품을 월 100만 개 생산합니다. 두께 규격은 10.00 ± 0.30 mm인데, 최근 고객사에서 두께 상한 초과 불량 클레임이 들어왔습니다.\n설비 담당자는 설비 노후가 원인이라며 설비 교체를 요청했고, 생산팀은 공정 평균만 조정하면 해결된다고 주장합니다.\n당신은 품질관리팀 신입 엔지니어로서 공정능력 계산 결과를 근거로 어느 쪽을 먼저 해야 하는지 팀장에게 발표해야 합니다.","task":"공정능력지수와 예상 불량률을 계산하고, 그 결과를 바탕으로 개선안·기대효과·남은 문제점을 설정한 발표 시간 안에 발표하세요.","options":[],"materials":[{"kind":"자사현황","title":"두께 측정 데이터 요약(가상)","status":"가상 자료","body":"","table":{"headers":["항목","값"],"rows":[["규격(상·하한)","10.30 / 9.70 mm"],["공정 평균","10.06 mm"],["공정 표준편차","0.08 mm"],["측정 시료 수","n = 200"],["월 생산량","1,000,000개"],["고객사 요구 Cpk(가정)","1.33 이상"]]},"source":"가상 내부 자료(연습용)"},{"kind":"문제점","title":"현장 의견 충돌: 설비 교체 vs 평균 조정","status":"가상 자료","body":"- 설비팀: 노후 설비라 산포가 크다, 교체 비용은 약 2억 원(가상), 납기 3개월\n- 생산팀: 세팅값만 보정하면 즉시 해결 가능, 비용은 거의 없음","table":null,"source":"가상 사례(연습용)"},{"kind":"개념","title":"공정능력지수 Cp와 Cpk","status":"개념 정리","body":"Cp는 규격 폭을 공정 산포(6σ)로 나눈 값으로 평균 치우침을 보지 못합니다. Cpk는 평균에서 가까운 규격 한계까지의 거리를 3σ로 나눈 값으로 치우침을 함께 반영합니다. 일반적으로 Cpk 1.33 이상을 양호한 공정으로 봅니다.","table":null,"source":"일반 품질관리 개념"}],"solve":{"title":"공정능력(Cp·Cpk)과 불량률 계산","problem":"아래 조건에서 (1) Cp와 Cpk를 구하고, (2) 정규분포를 가정해 현재 불량률(%와 ppm, 월 불량 개수)을 추정하고, (3) 평균을 10.00 mm로 중심화했을 때 Cpk와 불량률이 어떻게 달라지는지 비교하시오.","given":["규격: 10.00 ± 0.30 mm (하한 LSL = 9.70, 상한 USL = 10.30)","현재 공정 평균 μ = 10.06 mm","공정 표준편차 σ = 0.08 mm","월 생산량 1,000,000개","정규분포 가정. 표준정규분포 상위 확률: P(Z>3.00)=0.00135, P(Z>3.75)=0.0000884, P(Z>4.50)=0.0000034"],"formulas":[{"name":"Cp (공정 산포 능력)","expr":"Cp = (USL − LSL) / (6σ)","note":"평균 치우침은 반영하지 않음"},{"name":"Cpk (치우침 반영)","expr":"Cpk = min[(USL − μ)/(3σ), (μ − LSL)/(3σ)]","note":"더 가까운 규격 한계 기준"},{"name":"z 값과 불량률","expr":"z = (규격 한계 − μ)/σ,  불량률 = P(Z>z상) + P(Z>z하)","note":"양쪽 꼬리를 합산"}]},"basis":[{"kind":"산업","text":"제조업 공정·품질 직무 PT에서는 공정능력지수 계산 후 개선안을 제시하는 문제풀이형이 출제될 수 있습니다.(출제 가능 이슈 예시)"},{"kind":"기업","text":"전자부품 제조사는 고객사의 품질 요구(Cpk 기준)와 클레임 대응이 중요한 이슈입니다.(예시)"}]},{"id":"A2","type":"전략형","title":"불량률이 절반으로 줄었다는 보고, 그대로 믿어도 될까요?","summary":"최종 검사 불량률이 크게 줄었다는 보고를 받고, 여러 자료를 엮어 그 숫자를 어떻게 판단하고 무엇을 확인·조치할지 제안하는 문제입니다.","abilities":["비판적 사고","추론","정량 분석"],"situation":"품질팀은 이번 달 최종 검사 불량률이 1.2%에서 0.6%로 절반이 됐다고 보고했습니다.\n같은 달 검사 인원 2명이 다른 라인으로 옮겼고, 검사 방식이 전수 검사에서 샘플 검사로 바뀌었습니다.\n팀장은 이 결과를 고객사 정기 회의에서 개선 성과로 발표하려 합니다.","task":"이 보고를 어떻게 판단하는지 밝히고, 무엇을 확인하고 어떻게 조치할지 제안하세요.","options":[],"materials":[{"kind":"자사현황","title":"월별 최종 검사 실적","status":"가상 자료","body":"","table":{"headers":["월","생산량","검사 수량","불량 수","불량률"],"rows":[["8월","100,000개","100,000개","1,200개","1.2%"],["9월","98,000개","9,800개","59개","0.6%"]]},"source":"가상(연습용)"},{"kind":"자사현황","title":"고객사 반품 현황","status":"가상 자료","body":"","table":{"headers":["월","반품 수량","주요 사유"],"rows":[["8월","40개","외관 긁힘"],["9월","135개","두께 초과, 외관 긁힘"]]},"source":"가상(연습용)"},{"kind":"현장의견","title":"검사 담당자 이야기","status":"가상 자료","body":"‘샘플은 매시간 첫 생산분에서 뽑고 있어요. 그때가 설비가 제일 안정적이라 측정하기도 편하거든요.’","table":null,"source":"가상(연습용)"},{"kind":"개념","title":"샘플링 검사와 대표성","status":"개념 정리","body":"샘플 검사 결과는 샘플이 전체 생산품을 고르게 대표할 때만 믿을 수 있습니다. 특정 시간대·조건에서만 뽑으면 실제 불량률을 낮게 보는 편향이 생깁니다.","table":null,"source":"일반 품질관리 개념"}],"solve":null,"basis":[{"kind":"산업","text":"제조 품질 직무에서는 지표 개선 보고의 신뢰성을 검증하는 역량을 묻는 문제가 나올 수 있습니다.(출제 가능 이슈 예시)"}]}]},{"id":"B","name":"공정 개선 의사결정","desc":"한정된 예산으로 개선 우선순위를 정하는 일","problems":[{"id":"B1","type":"상황형","title":"수율 개선 예산 1억 원, 어디에 먼저 쓰시겠습니까?","summary":"라인 수율이 목표에 못 미치는 상황에서, 세 가지 개선안 중 하나를 고르고 불량 원인·비용·효과 자료로 근거를 제시하는 문제입니다.","abilities":["자료 결합 분석","창의적 사고","문제해결 과정"],"situation":"금속 부품 라인의 수율은 94%로, 올해 목표 97%에 못 미칩니다. 수율 개선 예산은 1억 원입니다.\n품질팀, 설비팀, 생산팀이 각각 다른 개선안을 내놓았습니다.","task":"세 안 중 하나를 고르고, 그 이유와 실행 계획을 제시하세요.","options":[{"label":"A","title":"AI 비전 검사기 도입","desc":"최종 공정에 AI 비전 검사기를 설치해 불량품이 고객에게 나가는 것을 막는 안입니다.\n고객 클레임을 빠르게 줄이고 검사 인력을 아낄 수 있습니다.\n하지만 불량이 생기는 원인은 그대로 남아, 버려지는 불량품과 비용은 줄지 않습니다.","pro":"고객 유출 차단, 검사 인력 절감","con":"불량 발생 원인은 그대로"},{"label":"B","title":"설비 예방정비 강화","desc":"금형과 이송 지그를 정해진 주기에 맞춰 점검·교체하는 예방정비 체계를 만드는 안입니다.\n불량이 생기는 원인을 직접 줄일 수 있습니다.\n하지만 효과가 나타나기까지 시간이 걸리고, 정비 시간만큼 생산이 멈춥니다.","pro":"원인 제거, 장기 효과","con":"효과까지 시간, 생산 중단 시간"},{"label":"C","title":"작업자 교육·작업 표준 개선","desc":"설비 세팅 방법을 표준화하고 작업자를 교육하는 안입니다.\n비용이 가장 적고 효과가 빨리 나타납니다.\n하지만 사람에 따라 효과가 달라지고, 설비 때문에 생기는 불량에는 효과가 작습니다.","pro":"저비용, 빠른 효과","con":"효과 범위 제한"}],"materials":[{"kind":"자사현황","title":"불량 유형별 비중과 추정 원인","status":"가상 자료","body":"","table":{"headers":["불량 유형","비중","추정 원인"],"rows":[["두께 초과","48%","금형 마모"],["외관 긁힘","27%","이송 지그 마모"],["치수 불량","15%","작업자 세팅 편차"],["기타","10%","—"]]},"source":"가상(연습용)"},{"kind":"내부메모","title":"개선안별 비용과 효과 추정","status":"가상 자료","body":"","table":{"headers":["안","비용","수율 개선 추정","효과 시점"],"rows":[["A 비전 검사기","9,000만 원","+0.5%p (유출만 차단)","2개월 뒤"],["B 예방정비","6,000만 원","+2.0%p","4개월 뒤"],["C 교육·표준","1,500만 원","+0.6%p","1개월 뒤"]]},"source":"가상(연습용)"},{"kind":"현장의견","title":"설비 정비 기록 메모","status":"가상 자료","body":"‘금형 교체 기준은 30만 타인데, 생산 일정에 밀려서 실제로는 평균 42만 타쯤에 바꾸고 있습니다.’","table":null,"source":"가상(연습용)"}],"solve":null,"basis":[{"kind":"산업","text":"제조업에서는 검사 강화와 원인 개선 사이의 투자 우선순위를 묻는 문제가 자주 다뤄집니다.(출제 가능 이슈 예시)"}]}]}]},"solutions":{"A1":{"kind":"pt-solution","problemId":"A1","intent":{"summary":"Cp와 Cpk를 함께 계산해 두 값의 차이가 ‘평균의 치우침’이라는 것을 읽어 내는지 봅니다. 계산 결과를 설비 교체와 평균 조정이라는 현장 논쟁의 판단 근거로 쓰고, 고객 요구와의 차이까지 스스로 말하는지 확인합니다.","materials":[{"ref":0,"insight":"평균이 상한 쪽으로 0.06 mm 치우쳐 있고, 고객 요구(1.33)에는 중심화만으로 부족","tests":"정량 분석 · 비판적 사고","trap":"표면 지표의 함정: Cp 1.25만 보면 충분해 보이지만 Cpk와 고객 요구 1.33을 함께 봐야 함","keywords":["10.06","0.08","Cpk","1.33"]},{"ref":1,"insight":"비용·시간이 적은 중심화를 먼저, 부족분은 산포 개선으로 단계화","tests":"이해관계자 조율 · 문제해결 과정","trap":"상충하는 신호: 설비팀과 생산팀 주장 중 계산이 어느 쪽을 지지하는지 판단","keywords":["설비 교체","평균 조정","세팅","중심화"]},{"ref":2,"insight":"Cp와 Cpk의 차이가 ‘치우침’의 크기를 보여줌","tests":"논리적 사고","trap":"판단 기준을 세우게 하는 개념 자료","keywords":["Cp","Cpk","산포","치우침"]}]},"feedback":null,"model":{"choice":"","choiceReason":"","C":"두께 규격은 10.00 ± 0.30 mm인데 공정 평균은 10.06 mm, 표준편차는 0.08 mm입니다. 계산하면 Cp는 1.25로 산포는 규격 폭에 비해 충분하지만, Cpk는 1.00입니다. 평균이 상한 쪽으로 치우쳐 현재 불량률이 약 0.135%, 월 약 1,350개이며 불량은 거의 상한 초과에서 나옵니다.","S":"설비 교체에 앞서 공정 평균 중심화를 먼저 실행하고, 부족한 산포는 단계적으로 개선하겠습니다. 산포는 이미 충분하고 평균만 상한 쪽으로 치우쳐 있어서, 치우침은 설비 교체 없이 세팅만으로 바로잡을 수 있기 때문입니다. 1단계로 평균을 10.00 mm로 맞추는 세팅 보정과 초기 조건 점검을 즉시 실행합니다. 비용이 거의 들지 않고 효과가 바로 나옵니다. 2단계로 보정 후 데이터를 2주간 모니터링해 산포가 목표에 못 미치면 그때 설비 점검과 교체를 검토합니다.","F":"중심화만으로 Cpk가 1.25가 되고 불량률은 약 177 ppm, 월 약 177개로 줄어 월 약 1,170개의 불량이 감소합니다(약 87%). 클레임 대응 비용과 재작업 비용도 함께 줄 것으로 기대합니다.","L":"중심화해도 Cpk 1.25는 고객 요구 1.33에 못 미칩니다. 1.33에 닿으려면 σ를 약 0.075 mm 이하로 줄여야 하므로, 산포의 원인인 설비 상태와 공정 변동을 계속 분석해야 합니다. 또 정규분포·안정 공정 가정과 n=200이라는 표본 크기의 한계가 있어 정기적으로 다시 확인하겠습니다."},"solveAnswer":{"steps":[{"title":"1) 가정 정리","work":"공정은 안정 상태이고 두께는 정규분포를 따르며, 측정 오차는 무시한다고 가정합니다.","why":"가정을 먼저 밝혀야 결과의 한계도 설명할 수 있습니다."},{"title":"2) Cp 계산","work":"Cp = (10.30 − 9.70) / (6 × 0.08) = 0.60 / 0.48 = 1.25","why":"산포 자체는 규격 폭 대비 충분한지 확인합니다."},{"title":"3) Cpk 계산","work":"상한 쪽: (10.30 − 10.06) / (3 × 0.08) = 0.24 / 0.24 = 1.00\n하한 쪽: (10.06 − 9.70) / (3 × 0.08) = 0.36 / 0.24 = 1.50\nCpk = min(1.00, 1.50) = 1.00","why":"Cp는 1.25인데 Cpk가 1.00이라는 것은 평균이 상한 쪽으로 치우쳤다는 신호입니다."},{"title":"4) 현재 불량률","work":"z상 = 0.24 / 0.08 = 3.00 → P = 0.00135 (0.135%)\nz하 = 0.36 / 0.08 = 4.50 → P = 0.0000034 (0.00034%)\n합계 ≈ 0.00135 ≈ 1,350 ppm → 월 약 1,350개","why":"불량은 거의 전부 상한 초과에서 나옵니다."},{"title":"5) 평균 중심화(μ = 10.00)","work":"Cpk = Cp = 1.25\nz = 0.30 / 0.08 = 3.75 → 한쪽 P = 0.0000884, 양쪽 합 ≈ 0.000177 ≈ 177 ppm → 월 약 177개","why":"산포는 그대로인데 평균만 맞춰도 불량이 크게 줄어듭니다."},{"title":"6) 비교와 검산","work":"월 불량 1,350개 → 177개, 약 1,173개 감소(약 87% 감소)\n검산: 평균이 중앙일 때 Cp = Cpk가 되는지, z = 3σ일 때 0.135%가 표준정규분포표와 맞는지 확인","why":"계산 결과가 상식(규격 중앙일수록 불량이 최소)과 맞는지 확인하는 단계입니다."}],"answer":"Cp = 1.25, Cpk = 1.00, 현재 불량률 약 0.135%(≈1,350 ppm, 월 약 1,350개). 평균을 10.00 mm로 중심화하면 Cpk = 1.25, 불량률 약 0.018%(≈177 ppm, 월 약 177개).","answerKeys":["1.25","1.0","1350","177"],"check":"Cp ≥ Cpk 관계, 단위(mm)와 ppm 환산(0.001 = 1,000 ppm), z값과 정규분포표 일치 여부를 확인했습니다.","pitfalls":["Cp만 보고 ‘충분하다’고 결론 내리는 것(평균 치우침은 Cpk로 확인)","한쪽 꼬리만 계산하거나 σ가 아닌 규격 폭으로 z를 계산하는 것","%와 ppm, 월 불량 개수 환산 실수"]},"checklist":[{"item":"Cp와 Cpk를 둘 다 계산하고 두 값의 차이가 무엇을 뜻하는지 설명했다","why":"차이가 평균 치우침의 크기를 보여주기 때문입니다."},{"item":"계산 과정을 가정 → 식 → 숫자 → 검산 순서로 말했다","why":"답만 말하면 이해 여부를 판단할 수 없습니다."},{"item":"최종 값(1.25, 1.00, 약 1,350 ppm, 약 177 ppm)이 맞다","why":"문제풀이형은 정확성이 기본 평가 항목입니다."},{"item":"해결방안마다 자료의 수치·단서를 근거로 붙이고, 우선순위와 실행 방법을 말했다","why":"해결방안이 여러 개일수록 근거와 순서가 있어야 설득됩니다."},{"item":"기대효과를 불량 개수·비율 등 숫자로 말했다","why":"현업에서는 효과를 비용·불량 수로 환산해 설득합니다."},{"item":"한계(고객 요구 Cpk 미달, 가정의 한계)를 먼저 말했다","why":"가정과 오차를 아는 엔지니어가 더 신뢰받습니다."}],"direction":[{"step":"C","title":"문제점 및 현황 분석 — 조건 정리","guide":"규격, 평균, 표준편차, 클레임 내용을 짧게 정리하고 구해야 할 것(Cp, Cpk, 불량률)을 밝힙니다.","frame":"규격은 ○○, 평균 ○○, 표준편차 ○○입니다. 구할 것은 ○○, ○○, ○○입니다.","refs":[0,1],"how":"조건 3개 + 구할 값 3개를 한 번에 정리","mistake":"조건을 하나씩 모두 읽느라 시간을 쓰는 것"},{"step":"V","title":"풀이 과정 — 가정, 식, 계산, 검산","guide":"계산은 ‘가정 → 식 → 숫자 대입 → 결과 해석 → 검산’ 순서로 정리합니다. 숫자는 천천히, 해석은 한 문장으로 붙입니다.","frame":"○○를 가정하면 ○○는 (식)=○○입니다. 이는 ○○를 뜻합니다.","refs":[2],"how":"Cp=1.25, Cpk=1.00을 구한 직후 ‘차이 0.25는 치우침’이라고 해석","mistake":"Cp만 구하고 ‘산포가 충분하니 문제없다’고 결론 내리는 것"},{"step":"S","title":"해결방안 — 자료 → 근거 → 실행안","guide":"해결방안은 여러 개여도 됩니다. 각 방안마다 자료의 숫자·단서를 근거로 붙이고, 무엇을 먼저 할지 우선순위와 실행 방법(예산·일정·역할)을 함께 씁니다. 비용과 시간이 적은 조치부터 순서대로 제시하고, 다음 단계로 넘어가는 판단 기준을 함께 말합니다.","frame":"1단계로 ○○를 보정하고, ○주 모니터링 후 ○○가 부족하면 ○○를 검토합니다.","refs":[2,1],"how":"1단계 중심화 → 2주 모니터링 → 필요 시 설비 교체 검토","mistake":"설비 교체 같은 큰 비용 조치를 근거 없이 먼저 말하는 것"},{"step":"F","title":"기대효과 — 불량 수와 비용으로 환산","guide":"효과를 %와 ppm, 월 불량 개수로 말하고, 가능하면 비용으로 환산합니다.","frame":"불량이 월 ○○개에서 ○○개로 줄어 약 ○○% 감소합니다.","refs":[0],"how":"1,350개 → 177개, 월 약 1,170개 감소","mistake":"‘품질이 좋아질 것’처럼 숫자 없이 말하는 것"},{"step":"L","title":"남아있는 문제점 — 가정과 한계","guide":"중심화만으로 고객 요구(1.33)에 못 미친다는 점과 정규성·표본 크기 가정의 한계를 스스로 먼저 말합니다.","frame":"다만 ○○가 남습니다. ○○까지 줄이려면 ○○가 필요하고, ○○ 가정도 계속 확인하겠습니다.","refs":[0,2],"how":"한계 + 필요한 후속 조치(σ ≤ 0.075 mm)","mistake":"가정을 숨기고 정답이 확정인 것처럼 말하는 것"}],"scenario":[{"name":"오프닝 멘트","prep":[],"minutes":0.5,"script":"안녕하십니까, 품질관리팀 지원자 ○○○입니다. [[숫자 하나만 먼저 보여드리겠습니다.]] 월 100만 개 중 약 1,350개. 지금 고객사가 항의하는 불량의 규모입니다. 이 숫자가 어디서 나오는지, 그리고 얼마까지 줄일 수 있는지 계산으로 말씀드리겠습니다.","connector":"","check":"처음 20초 안에 불량 규모(숫자)로 관심을 열었는가?"},{"name":"서론 — 주제의 중요성","prep":["P"],"minutes":1,"script":"클레임이 반복되면 비용도 신뢰도 같이 무너집니다. 그런데 현장에서는 설비를 바꾸자는 의견과 세팅만 바꾸자는 의견이 맞서고 있습니다. [[누구 말이 맞을까요?]] 계산해 보면 답이 나옵니다. 제 결론은 설비 교체 전에 공정 평균 중심화를 먼저 실행하자는 것입니다.","connector":"불량 숫자 이야기에서 현장의 논쟁으로 넘어가고, 계산으로 답하겠다고 예고하며 결론을 먼저 말합니다.","check":"결론이 서론 안에서 분명히 나왔는가?"},{"name":"목차 소개","prep":[],"minutes":0.5,"script":"순서는 세 가지입니다. 첫째, 조건을 정리하고 무엇을 구할지 말씀드립니다. 둘째, 계산 과정과 개선안입니다. 셋째, 기대효과와 아직 남는 문제입니다.","connector":"결론을 말했으니 그 근거를 계산으로 보여줄 순서를 안내합니다.","check":"목차 3개가 본론 1·2·3과 맞는가?"},{"name":"본론 1 — 문제 현황과 조건 정리","prep":["C"],"minutes":1,"script":"첫째, 조건입니다. 규격은 10.00에 플러스마이너스 0.30 밀리미터, 현재 평균은 10.06, 표준편차는 0.08입니다. 구할 것은 Cp, Cpk, 그리고 불량률입니다. [[평균이 10.06이면 규격 중앙인 10.00과 얼마나 다를까요?]] 0.06 밀리미터 상한 쪽으로 치우쳐 있습니다. 이 작은 치우침이 불량의 열쇠입니다.","connector":"결론에서 약속한 계산을 위해 필요한 조건을 정리하고, ‘치우침’이라는 핵심 단서를 다음 계산으로 넘깁니다.","check":"조건과 구할 값이 30초 안에 정리되었는가?"},{"name":"본론 2 — 풀이 과정과 해결방안","prep":["S"],"minutes":2,"script":"둘째, 해결방안입니다. 결론부터 말씀드리면 설비 교체 전에 평균 중심화를 먼저 하겠습니다. [[왜 설비가 아니라 평균일까요?]] 산포는 이미 충분하고, 치우침은 세팅만으로 바로잡을 수 있기 때문입니다. 계산으로 보겠습니다. 정규분포와 안정된 공정을 가정하면 Cp는 규격 폭 0.60을 6시그마 0.48로 나눈 1.25로 산포는 충분합니다. 그런데 Cpk는 상한 쪽 0.24를 3시그마 0.24로 나눈 1.00입니다. 평균이 치우쳐서 불량률이 약 0.135%, 월 1,350개입니다. 그래서 1단계로 세팅을 보정하고, 2주간 데이터를 본 뒤 산포가 부족하면 그때 설비 교체를 검토합니다. 큰 비용보다 작은 보정이 먼저입니다.","connector":"조건 정리에서 찾은 ‘치우침’ 단서를 받아, 해결방안과 그 근거, 실행 순서를 말합니다.","check":"해결방안마다 자료 근거와 실행 방법이 붙어 있는가?"},{"name":"본론 3 — 기대효과와 남은 문제점","prep":["F","L"],"minutes":1.5,"script":"셋째, 기대효과와 남은 문제입니다. 평균을 10.00으로 맞추면 Cpk는 1.25가 되고, 불량률은 약 177ppm, 월 약 177개로 줄어듭니다. 월 1,170개 정도, 약 87%가 줄어드는 셈입니다. [[그렇다면 이것으로 끝일까요?]] 아닙니다. 고객사가 요구하는 Cpk 1.33에는 아직 못 미칩니다. 그러려면 표준편차를 0.075 이하로 줄여야 하고, 정규분포와 표본 200개라는 가정의 한계도 계속 확인해야 합니다.","connector":"계산 결과를 숫자로 약속하고, 고객 요구와의 차이라는 남은 문제를 먼저 꺼내 후속 과제로 닫습니다.","check":"기대효과 숫자와 한계(1.33 미달, 가정)를 모두 말했는가?"},{"name":"요약 및 정리","prep":["P2"],"minutes":0.7,"script":"정리하겠습니다. 불량의 원인은 산포가 아니라 평균의 치우침이었고, 그래서 설비 교체보다 평균 중심화가 먼저입니다. 불량을 월 1,350개에서 177개로 줄이고, 남은 산포는 데이터를 보며 단계적으로 해결하겠습니다.","connector":"세 가지 본론을 되짚으며 처음 결론과 같은 방향으로 돌아옵니다.","check":"첫 결론과 마지막 결론이 같은 방향인가?"},{"name":"마무리 멘트","prep":[],"minutes":0.3,"script":"숫자는 현장의 논쟁을 끝내 줍니다. 계산으로 먼저 판단하는 엔지니어가 되겠습니다. 감사합니다.","connector":"오프닝의 숫자 이야기를 다시 꺼내 닫습니다.","check":"오프닝의 ‘숫자’ 이야기와 이어지는가?"}]}}}};

const $ = (s, r) => (r || document).querySelector(s);
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  kids.flat(Infinity).forEach(c => { if (c == null || c === false) return; e.append(c.nodeType ? c : document.createTextNode(String(c))); });
  return e;
}
function rich(t, cls) {
  const box = h('div', { class: 'rich' + (cls ? ' ' + cls : '') });
  String(t || '').split('\n').forEach(line => {
    if (!line.trim()) return;
    const voice = /^\s*[‘“'"]/.test(line);
    const p = h('p', voice ? { class: 'voice' } : {});
    line.split(/(\[\[.*?\]\])/g).forEach(seg => {
      if (/^\[\[.*\]\]$/.test(seg)) p.append(h('mark', { class: 'as' }, seg.slice(2, -2)));
      else if (seg) p.append(seg);
    });
    box.append(p);
  });
  return box;
}
function table(t, cls) {
  if (!t || !Array.isArray(t.headers)) return null;
  return h('div', { class: 'tw' }, h('table', cls ? { class: cls } : {},
    h('thead', {}, h('tr', {}, t.headers.map(x => h('th', {}, x)))),
    h('tbody', {}, (t.rows || []).map(r => h('tr', {}, r.map(c => h('td', {}, c)))))));
}
function sec(id, title, lead, ...kids) { return h('section', { id }, h('h2', {}, title), lead ? h('p', { class: 'lead' }, lead) : null, ...kids); }
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 2000); }
const mem = {};
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return mem[k] != null ? mem[k] : null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { mem[k] = v; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { delete mem[k]; } }
};
const jget = (k, d) => { try { const v = store.get(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };

        d.refs && d.refs.length ? h('div', { class: 'chips' }, h('span', { class: 'note' }, '쓸 자료 →'), d.refs.map(r => mats[r] ? h('span', { class: 'tag' }, '자료 ' + (r + 1) + ' ' + mats[r].title) : null)) : null,
        d.how ? h('div', { class: 'hint' }, '쓰는 법 · ' + d.how) : null, d.mistake ? h('div', { class: 'warnbox' }, '자주 하는 실수 · ' + d.mistake) : null)));
  });
  app.append(sec('direction', '답변 방향', '문제 현황 → 해결방안 → 기대효과 → 남아있는 문제점 순서로, 칸마다 어떤 자료를 어떻게 쓰는지 정리했습니다.',
    legend(), h('div', { class: 'seq' }, h('span', { class: 'note' }, '답변 흐름'), dir.map((d, i) => [i ? h('span', { class: 'ar' }, '→') : null, pill(TAG[d.step] || 'E')])), ...dItems));

  /* Ⅶ 발표 시나리오 */
  const scs = X.scenario || [];
  const totalEst = Math.round(scs.reduce((a, s) => a + chars(s), 0) / 330 * 10) / 10;
  const big = h('div', { class: 'big' }), sb = h('button', { class: 'btn primary' }, '시작'), rs = h('button', { class: 'btn' }, '리셋');
  const st2 = makeTimer(SPEECH * 60, big, sb); rs.onclick = () => st2.reset();
  app.append(sec('scenario', '발표 시나리오', '노란 밑줄은 자문자답 문장입니다. 청중에게 묻듯 톤을 바꿔 소리 내어 연습하세요. (분당 약 330자 기준)',
    legend(), h('div', { class: 'stimer', 'data-noexport': '' }, big, sb, rs, h('small', {}, '발표 ' + SPEECH + '분 타이머 · 이 대본의 예상 시간은 약 ' + totalEst + '분입니다.')),
    scs.map((s, i) => h('div', { class: 'sc' }, h('h4', {}, h('span', { class: 'no' }, String(i + 1).padStart(2, '0')), s.name, (s.prep || []).map(pill), h('span', { class: 'tag gray' }, '약 ' + est(s) + '분 · ' + chars(s) + '자')),
      rich(s.script, 'script'), s.connector ? h('div', { class: 'applyl' }, h('b', {}, '앞 구간과의 연결 · '), s.connector) : null, s.check ? h('div', { class: 'checkl' }, h('b', {}, '자기 점검 · '), s.check) : null))));

  /* Ⅷ 논리 흐름 */
  const seq = []; scs.forEach(s => (s.prep || []).forEach(p => seq.push(p)));
  const iE = seq.lastIndexOf('S'), iF = seq.indexOf('F'), iL = seq.indexOf('L');
  const s2 = scs.find(s => /^본론\s*2/.test(s.name)); const tg = (s2 && s2.prep) || [];
  const tol = Math.max(0.7, SPEECH * 0.15);
  const checks = [
    [seq[0] === 'P', '결론 먼저(P) — 서론에서 결론을 먼저 말함', '첫 요소가 결론이 아닙니다.'],
    [seq.indexOf('C') !== -1 && seq.indexOf('S') !== -1 && seq.indexOf('C') < seq.indexOf('S'), '문제점 및 현황 분석(C)이 해결방안(S)보다 먼저 나옴', '현황 분석을 먼저 말한 뒤 해결방안으로 넘어가세요.'],
    [tg.indexOf('S') !== -1, '본론 2에서 해결방안(S)을 다룸', '본론 2에 해결방안이 없습니다.'],
    [iF !== -1 && iF > iE, '해결방안 뒤에 기대효과(F)가 나옴', '기대효과가 없거나 순서가 앞섭니다.'],
    [iL !== -1 && iL > iF, '기대효과 뒤에 남아있는 문제점(L)을 말함', '남아있는 문제점과 보완책이 빠졌습니다.'],
    [seq.length > 0 && seq[seq.length - 1] === 'P2', '마지막에 결론을 다시 말함', '마지막이 결론 재강조가 아닙니다.'],
    [scs.filter(s => /^본론/.test(s.name)).length === 3, '본론이 3단 구성임', '본론이 3개가 아닙니다.'],
    [scs.slice(1).every(s => (s.connector || '').trim()), '모든 구간에 앞 구간과의 연결 문장이 있음', '연결 문장이 빠진 구간이 있습니다.'],
    [scs.reduce((a, s) => a + (String(s.script).match(/\[\[.*?\]\]/g) || []).length, 0) >= 2, '자문자답이 2회 이상 들어감', '자문자답이 부족합니다.'],
    [Math.abs(totalEst - SPEECH) <= tol, '대본 예상 시간(' + totalEst + '분)이 발표 시간(' + SPEECH + '분)에 맞음', '대본 분량을 조정하세요.']
  ];
  app.append(sec('flow', '논리 흐름 점검', '구간 연결, 현황 → 해결방안 → 기대효과 → 남아있는 문제점 순서, 시간 배분을 자동으로 확인했습니다. (' + checks.filter(c => c[0]).length + '/' + checks.length + ' 충족)',
    h('div', { class: 'fbar' }, scs.map(s => h('i', { style: 'flex:' + Math.max(est(s), 0.2), title: s.name }))),
    h('div', {}, scs.map((s, i) => h('div', { class: 'fl' }, h('div', { class: 'n' }, String(i + 1)), h('div', {}, h('div', { class: 't' }, s.name, (s.prep || []).map(pill), h('span', { class: 'm' }, est(s) + '분')), h('div', { class: 'cn' }, h('em', {}, s.connector ? '연결' : '시작'), s.connector || '청중의 관심을 여는 첫 구간'))))),
    h('p', { class: 'k' }, '자동 흐름 점검'),
    h('div', { class: 'seq' }, h('span', { class: 'note' }, '발표 흐름'), seq.map((p, i) => [i ? h('span', { class: 'ar' }, '→') : null, pill(p)])),
    h('table', {}, h('tbody', {}, checks.map(c => h('tr', {}, h('td', { style: 'width:70px;text-align:center' }, h('span', { class: 'status ' + (c[0] ? 's-ok' : 's-warn') }, c[0] ? '충족' : '보완')), h('td', {}, c[0] ? c[1] : c[1] + ' — ' + c[2])))))));
  app.append(h('footer', {}, '이 시험지는 연습용입니다. 자료의 수치·사례는 면접 전 반드시 직접 확인하세요.'));
}
