<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PT면접 연습 시험지</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
:root{
  color-scheme:light;
  --paper:#ffffff; --bg:#f6f8fc; --ink:#0f172a; --ink-2:#334155; --muted:#64748b; --soft:#94a3b8;
  --rule:#e2e8f0; --rule-2:#cbd5e1; --blue:#1c60ef; --blue-tint:#eef4ff; --blue-2:#dbe8fe;
  --c-p:#2563eb; --c-r:#0d9488; --c-e:#7c3aed; --c-p2:#ea580c; --c-f:#0891b2; --c-c:#0369a1; --c-l:#be123c;
  --ok:#16a34a; --warn:#ca8a04; --bad:#dc2626; --as:#fef3c7;
  --r:12px; --font:"Pretendard Variable",Pretendard,"Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--rule)}
.top .wrap{display:flex;align-items:center;gap:18px;height:56px}
.brand{font-weight:800;letter-spacing:-.02em;white-space:nowrap;display:flex;align-items:center;gap:8px}
.brand i{width:10px;height:10px;border-radius:3px;background:var(--blue);display:inline-block}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1}
.nav::-webkit-scrollbar{display:none}
.nav a{text-decoration:none;font-size:13.5px;color:var(--muted);padding:6px 10px;border-radius:8px;white-space:nowrap;font-weight:500}
.nav a:hover{background:var(--blue-tint);color:var(--blue)}
.tools{display:flex;gap:6px;align-items:center}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:15px;padding:5px 11px;border-radius:8px;background:var(--blue-tint);color:var(--blue);min-width:68px;text-align:center}
.timer.low{background:#fef2f2;color:var(--bad)}
.btn{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--rule-2);background:#fff;color:var(--ink-2);padding:6px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{color:#fff;opacity:.92}
.btn.big{font-size:15px;padding:11px 22px;border-radius:10px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
section{padding:56px 0 8px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--blue);margin:0 0 6px}
h2{font-size:26px;letter-spacing:-.03em;margin:0 0 6px;line-height:1.3}
.lead{color:var(--muted);margin:0 0 22px;font-size:14.5px}
.panel{background:var(--paper);border:1px solid var(--rule);border-radius:var(--r);box-shadow:0 1px 2px rgba(15,23,42,.04)}
.hero{padding:48px 0 8px}
.hero h1{font-size:clamp(26px,4vw,38px);letter-spacing:-.035em;line-height:1.25;margin:0 0 14px}
.target{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 26px}
.target b{font-weight:600;font-size:14px;background:#fff;border:1px solid var(--rule);padding:6px 12px;border-radius:999px}
.target b em{font-style:normal;color:var(--muted);font-weight:500;margin-right:6px;font-size:12.5px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{padding:18px 20px}
.stat .n{font-size:30px;font-weight:800;letter-spacing:-.04em;line-height:1.15}
.stat .n small{font-size:15px;color:var(--soft);font-weight:600;margin-left:2px}
.stat .l{font-size:13px;color:var(--muted);margin-top:4px}
.howto{margin-top:14px;font-size:13.5px;color:var(--muted);display:flex;gap:18px;flex-wrap:wrap}
.howto span::before{content:"→ ";color:var(--blue);font-weight:700}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:3px 9px 3px 7px;border-radius:999px;background:#fff;border:1px solid var(--rule-2);line-height:1.4;white-space:nowrap;color:var(--ink-2)}
.chip .dot{width:7px;height:7px;border-radius:50%;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.status{flex:none;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-ok{color:var(--ok);background:#ecfdf3}.s-warn{color:#a16207;background:#fefce8}.s-gray{color:#64748b;background:#f1f5f9}.s-bad{color:var(--bad);background:#fef2f2}
mark.as{background:linear-gradient(transparent 55%,var(--as) 55%);color:inherit;padding:0 1px}
.rich p{margin:0 0 8px}
.rich p:last-child{margin:0}
.k{font-size:11.5px;font-weight:700;color:var(--soft);letter-spacing:.04em;margin-bottom:4px}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{padding:18px 20px;display:flex;flex-direction:column;gap:11px;break-inside:avoid;page-break-inside:avoid}
.card h3{margin:0;font-size:17.5px;letter-spacing:-.02em;line-height:1.4}
.card .hd{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.card .src{font-size:12px;color:var(--soft)}
.big-q{padding:26px 28px;display:flex;flex-direction:column;gap:18px}
.story{font-size:clamp(17px,2.2vw,21px);font-weight:700;letter-spacing:-.02em;line-height:1.5;border-left:4px solid var(--blue);padding:4px 0 4px 18px;margin:0}
.story small{display:block;font-size:12px;font-weight:700;color:var(--blue);letter-spacing:.06em;margin-bottom:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.box{background:var(--bg);border-radius:10px;padding:14px 16px;font-size:14px;color:var(--ink)}
.box h4{margin:0 0 6px;font-size:13px;color:var(--blue)}
.opt .lab{width:30px;height:30px;border-radius:9px;background:var(--blue);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.opt .pc{font-size:13px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt .pc div{border-radius:8px;padding:8px 10px}
.opt .pc .pro{background:#f0fdf4;color:#166534}
.opt .pc .con{background:#fff7ed;color:#9a3412}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:700;padding:9px 12px;border-bottom:1px solid var(--rule);background:#fbfcfe;white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--rule);vertical-align:top;color:var(--ink-2)}
tr:last-child td{border-bottom:0}
ul.plain{margin:0;padding-left:18px;font-size:14px;color:var(--ink-2)}
ul.plain li{margin-bottom:4px}
/* answer */
.wk{padding:22px 26px 26px;display:flex;flex-direction:column;gap:18px}
.pick{display:flex;gap:8px;flex-wrap:wrap}
.pick label{display:flex;align-items:center;gap:8px;border:1px solid var(--rule-2);border-radius:10px;padding:9px 14px;cursor:pointer;font-size:14px;font-weight:600;background:#fff}
.pick label.on{border-color:var(--blue);background:var(--blue-tint);color:var(--blue)}
.pick input{accent-color:var(--blue)}
.ans{display:grid;grid-template-columns:30px 1fr;gap:12px}
.ans .no{width:28px;height:28px;border-radius:50%;background:var(--blue);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
.ans label{font-weight:800;font-size:15px;display:block}
.ans label small{font-weight:500;color:var(--muted);font-size:13px;margin-left:6px}
.ans textarea{font:inherit;font-size:14.5px;border:1px solid var(--rule-2);border-radius:10px;padding:10px 12px;width:100%;min-height:96px;resize:vertical;line-height:1.7;color:var(--ink);background:#fff;margin-top:6px}
.ans textarea:focus{outline:2px solid var(--blue-2);border-color:var(--blue)}
.ans .cnt{font-size:12px;color:var(--soft);text-align:right}
.wact{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.wnote{font-size:13px;color:var(--muted)}
/* compare */
.lock{padding:34px 28px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.lock h3{margin:0;font-size:19px}
.lock p{margin:0;color:var(--muted);font-size:14px}
.cmp{display:flex;flex-direction:column}
.cmp .row{display:grid;grid-template-columns:90px 1fr 1fr;gap:16px;padding:16px 22px;border-top:1px solid var(--rule)}
.cmp .row.hd{border-top:0;background:#fbfcfe;font-size:12px;font-weight:700;color:var(--muted);padding-top:11px;padding-bottom:11px}
.cmp .step{font-weight:800;font-size:13px}
.cmp .me{font-size:14px;color:var(--ink-2);white-space:pre-wrap}
.cmp .me.empty{color:var(--soft);font-style:italic}
.cmp .ai{font-size:14px;color:var(--ink);background:var(--blue-tint);border-radius:10px;padding:10px 12px}
.pill{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:22px;border-radius:7px;color:#fff;font-size:11.5px;font-weight:800;padding:0 7px}
.p-P{background:var(--c-p)}.p-R{background:var(--c-r)}.p-E{background:var(--c-e)}.p-P2{background:var(--c-p2)}.p-C{background:var(--c-c)}.p-F{background:var(--c-f)}.p-L{background:var(--c-l)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);align-items:center;margin:0 0 14px}
.legend span{display:inline-flex;gap:6px;align-items:center}
.stimer{display:flex;gap:14px;align-items:center;padding:14px 20px;margin-bottom:14px;flex-wrap:wrap}
.stimer .big{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--blue);min-width:84px}
.stimer .big.low{color:var(--bad)}
.stimer small{color:var(--muted);font-size:13px;flex:1;min-width:200px}
.grp{border:1px solid var(--rule);border-radius:12px;padding:16px 18px 18px;background:#fcfdff}
.grp .gh{display:flex;gap:10px;align-items:center;margin-bottom:2px}
.grp .gh b{font-size:17px;letter-spacing:-.02em}
.grp .gn{font-size:12px;font-weight:800;color:#fff;background:var(--blue);border-radius:7px;padding:2px 9px}
.grp .gd{margin:0 0 12px;font-size:13.5px;color:var(--muted)}
.fld{display:flex;flex-direction:column;gap:6px}
.fld label{font-weight:800;font-size:14.5px}
.fld textarea{font:inherit;font-size:14.5px;border:1px solid var(--rule-2);border-radius:10px;padding:10px 12px;width:100%;min-height:120px;resize:vertical;line-height:1.7;color:var(--ink);background:#fff}
.fld textarea:focus{outline:2px solid var(--blue-2);border-color:var(--blue)}
.fld .cnt{font-size:12px;color:var(--soft);text-align:right}
.grp .one{display:grid;gap:14px}
.grp .two2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.grp .two2{grid-template-columns:1fr}}
.sv ol{margin:0;padding-left:0;list-style:none}
.dgrp{margin:18px 0 2px;font-size:13px;font-weight:800;color:var(--blue);background:var(--blue-tint);border-radius:8px;padding:6px 12px}
.dgrp:first-child{margin-top:12px}
.dgrp + .st{border-top:0}
.skel .st .lab::after{display:none}
.frame{font-size:13.5px;border-left:3px solid var(--blue);padding:4px 0 4px 12px;color:var(--ink);background:#fbfcff}
.sv li{margin-bottom:8px}
.mats{display:flex;flex-direction:column}
.mrow{display:grid;grid-template-columns:22px 1fr auto;gap:10px;padding:11px 20px;border-top:1px solid var(--rule);align-items:center;font-size:14px}
.mrow:first-child{border-top:0}
.mrow .hit{font-size:12px;font-weight:700}
.hit.y{color:var(--ok)}.hit.n{color:#b45309}
.chk{display:grid;grid-template-columns:24px 1fr;gap:10px;padding:12px 20px;border-top:1px solid var(--rule);font-size:14px;cursor:pointer}
.chk:first-child{border-top:0}
.chk input{width:17px;height:17px;accent-color:var(--blue);margin-top:3px}
.chk small{display:block;color:var(--muted);font-size:12.5px}
.score{display:flex;gap:14px;align-items:center;padding:14px 20px;border-top:1px solid var(--rule);background:#fbfcfe;border-radius:0 0 var(--r) var(--r);font-size:14px}
.score b{font-size:20px;color:var(--blue)}
.gap{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:14px}
/* direction */
.skel{padding:8px 22px 22px}
.st{display:grid;grid-template-columns:150px 1fr;gap:18px;padding:18px 0;position:relative}
.st + .st{border-top:1px solid var(--rule)}
.st .lab{font-weight:800;font-size:15px;display:flex;align-items:flex-start;gap:8px}
.st .lab b{flex:none;width:24px;height:24px;border-radius:50%;background:var(--blue);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.st .body{display:flex;flex-direction:column;gap:9px;font-size:14.5px}
.st:not(:last-child) .lab::after{content:"";position:absolute;left:11px;top:48px;bottom:-14px;border-left:2px solid var(--blue-2)}
.warnbox{font-size:13px;color:#9a3412;background:#fff7ed;border-radius:8px;padding:8px 12px}
.hint{font-size:13.5px;color:var(--ink-2);background:var(--bg);border-radius:8px;padding:9px 12px}
/* scenario */
.sc{padding:20px 22px;display:flex;flex-direction:column;gap:12px;break-inside:avoid;page-break-inside:avoid}
.sc .no{font-size:13px;font-weight:800;color:var(--blue)}
.sc h3{margin:0;font-size:18px;letter-spacing:-.02em;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sc .script{font-size:15.5px;line-height:1.9;color:var(--ink)}
.applyl{font-size:14px;border-left:3px solid var(--blue);padding:4px 0 4px 12px;color:var(--ink)}
.checkl{font-size:13px;color:var(--muted);border-top:1px dashed var(--rule);padding-top:10px}
.checkl b{color:var(--ink-2)}
.scs{display:flex;flex-direction:column;gap:14px}
/* flow */
.fbar{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px;margin:6px 0 12px}
.fbar i{display:block;height:100%;background:var(--blue)}
.fbar i:nth-child(2n){background:#7aa6f7}
.flow{padding:20px 22px;display:flex;flex-direction:column}
.fl{display:grid;grid-template-columns:28px 1fr;gap:12px;position:relative;padding-bottom:16px}
.fl:last-child{padding-bottom:0}
.fl:not(:last-child)::before{content:"";position:absolute;left:13px;top:28px;bottom:0;border-left:2px solid var(--blue-2)}
.fl .n{width:26px;height:26px;border-radius:50%;background:var(--blue-tint);color:var(--blue);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}
.fl .t{font-size:14.5px;font-weight:700;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.fl .t span.m{font-weight:500;color:var(--soft);font-size:12px}
.fl .cn{font-size:13.5px;color:var(--ink-2);margin-top:3px}
.fl .cn em{font-style:normal;font-weight:700;color:var(--blue);margin-right:6px;font-size:12px}
.chain{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;padding:13px 18px;border-top:1px solid var(--rule);font-size:14px}
.chain:first-child{border-top:0}
.seq{display:flex;gap:5px;flex-wrap:wrap;align-items:center;padding:14px 20px;border-bottom:1px solid var(--rule)}
.seq .ar{color:var(--soft)}
footer{padding:48px 0 60px;font-size:12.5px;color:var(--soft);text-align:center}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13.5px;padding:10px 16px;border-radius:10px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (max-width:760px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .two,.opt .pc{grid-template-columns:1fr}
  .cmp .row{grid-template-columns:1fr;gap:8px}
  .cmp .row.hd{display:none}
  .st{grid-template-columns:1fr;gap:8px}
  .st .lab::after{display:none}
  .wk{padding:18px 16px}
  .big-q{padding:20px 18px}
  .tools .btn.opt-b{display:none}
  h2{font-size:22px}
  .chain{grid-template-columns:1fr}
}
@media print{
  body{background:#fff;font-size:12.5px}
  .top,.tools,.wact,.toast{display:none!important}
  section{padding:24px 0 0}
  .panel,.card,.sc{box-shadow:none}
  h2{break-after:avoid}
}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand"><i></i>PT면접 시험지</div>
  <nav class="nav">
    <a href="#exam">시험지</a><a href="#mine">내 답안</a><a href="#compare">비교</a><a href="#direction">답변 방향</a><a href="#scenario">시나리오</a><a href="#flow">논리 흐름</a>
  </nav>
  <div class="tools"><span class="timer" id="timer">00:00</span><button class="btn opt-b" id="tToggle">시작</button><button class="btn primary" onclick="window.print()">PDF 저장</button></div>
</div></header>
<main id="app" class="wrap"></main>
<div class="toast" id="toast"></div>
<noscript>이 파일은 자바스크립트가 켜진 브라우저에서 열어주세요.</noscript>

<script>
/* ============ 여기부터 데이터 (AI는 이 구간의 값만 채운다) ============ */

        h('input', { type: 'radio', name: 'opt', value: o.label, onchange: () => { S.choice = o.label; save(); pick.querySelectorAll('label').forEach(l => l.classList.remove('on')); lab.classList.add('on'); renderCompare(); } }),
        o.label + '안 · ' + o.title);
      if (S.choice === o.label) lab.querySelector('input').checked = true;
      pick.append(lab);
    });
    wk.append(h('div', {}, h('p', { class: 'k' }, '내가 고른 선택지'), pick));
  }
  const field = (st, solo) => {
    const ta = h('textarea', { placeholder: st.ph, 'aria-label': st.name, style: st.k === 'V' ? 'min-height:150px' : (st.k === 'P' || st.k === 'P2') ? 'min-height:70px' : null });
    ta.value = S.ans[st.k] || '';
    const cnt = h('div', { class: 'cnt' }, ta.value.length + '자');
    ta.addEventListener('input', () => { S.ans[st.k] = ta.value; cnt.textContent = ta.value.length + '자'; save(); if (S.submitted) renderCompare(); });
    return h('div', { class: 'fld' }, solo ? null : h('label', {}, st.name), ta, cnt);
  };
  const byK = k => ANS.find(s => s.k === k);
  const groups = [
    { n: '본론 1', title: '문제점 및 현황 분석', desc: '지금 무엇이 얼마나 문제인지, 왜 그런지를 자료의 숫자로 정리합니다.', ks: ['C'] },
    { n: '본론 2', title: '해결방안 (PREP)', desc: SOLVE ? '풀이 과정과 답을 먼저 쓰고, 해결방안을 PREP(결론 → 이유 → 근거·실행 → 재강조) 순서로 씁니다.' : '해결방안을 PREP(결론 → 이유 → 근거·실행 → 재강조) 순서로 씁니다.', ks: SOLVE ? ['V', 'P', 'R', 'E', 'P2'] : ['P', 'R', 'E', 'P2'] },
    { n: '본론 3', title: '기대효과와 남아있는 문제점', desc: '실행하면 무엇이 얼마나 좋아지는지(기대효과)와, 그래도 남는 한계·보완책(남아있는 문제점)을 따로 씁니다.', ks: ['F', 'L'], two: true }
  ];
  groups.forEach(g => wk.append(h('div', { class: 'grp' },
    h('div', { class: 'gh' }, h('span', { class: 'gn' }, g.n), h('b', {}, g.title)),
    h('p', { class: 'gd' }, g.desc),
    h('div', { class: g.two ? 'two2' : 'one' }, g.ks.map(k => field(byK(k), g.ks.length === 1))))));
  wk.append(h('div', { class: 'wact' },
    h('button', { class: 'btn primary big', onclick: submit }, '답안 제출하고 모범답안 열기'),
    h('button', { class: 'btn ghost', onclick: () => { if (confirm('작성한 답안을 모두 지울까요?')) { S.ans = {}; S.choice = ''; S.submitted = false; S.checks = {}; save(); location.reload(); } } }, '답안 지우기'),
    h('span', { class: 'wnote' }, '작성 내용은 이 브라우저에 자동 저장됩니다.')));
  return sec('mine', 'STEP 2 · 내 답안', '본론 1·2·3 순서로 내 답을 정리해 보세요', '발표 시나리오의 본론 구성과 같은 순서입니다. 모범답안은 내가 쓴 뒤에 열립니다.', wk);
}
function submit() {
  const any = Object.values(S.ans).some(v => (v || '').trim());
  if (!any && !confirm('작성한 답안이 없습니다. 그래도 모범답안을 열까요?')) return;
  S.submitted = true; save(); renderCompare(); toast('모범답안이 열렸습니다');
  document.getElementById('compare').scrollIntoView();
}

/* ---- 4 비교 ---- */
const cmpHost = h('div');
function solveModel() {
  return h('div', { class: 'sv' },
    h('ol', {}, (SOLVE.steps || []).map(st => h('li', {}, h('b', {}, st.title), rich(st.work), st.why ? h('div', { class: 'wnote' }, st.why) : null))),
    h('div', { style: 'margin-top:8px' }, h('b', {}, '최종 답 · '), SOLVE.answer),
    SOLVE.check ? h('div', { class: 'wnote', style: 'margin-top:6px' }, '검산 · ' + SOLVE.check) : null,
    SOLVE.pitfalls && SOLVE.pitfalls.length ? h('div', { class: 'warnbox', style: 'margin-top:8px' }, '⚠ 자주 하는 실수: ' + SOLVE.pitfalls.join(' / ')) : null);
}
function renderCompare() {
  cmpHost.replaceChildren();
  if (!S.submitted) {
    cmpHost.append(h('div', { class: 'panel lock' }, h('h3', {}, '🔒 모범답안은 내 답안을 제출하면 열립니다'), h('p', {}, '먼저 STEP 2에서 내 답을 써보세요.'),
      h('button', { class: 'btn primary', onclick: submit }, '지금 제출하고 열기')));
    return;
  }
  const MD = D.model;
  const txt = ANS.map(s => S.ans[s.k] || '').join(' ');
  const norm = x => String(x).replace(/[\s,]/g, '');
  const rows = [h('div', { class: 'row hd' }, h('div', {}, '구조'), h('div', {}, '내 답안'), h('div', {}, 'AI 모범답안'))];
  ANS.forEach(st => {
    const mine = (S.ans[st.k] || '').trim();
    rows.push(h('div', { class: 'row' }, h('div', { class: 'step' }, pill(st.tag), h('div', { style: 'margin-top:6px;color:var(--muted);font-weight:600;font-size:12px' }, st.name)),
      h('div', { class: 'me' + (mine ? '' : ' empty') }, mine || '(작성하지 않음)'),
      h('div', { class: 'ai' }, st.k === 'V' ? solveModel() : rich(MD[st.k]))));
  });
  const wrap = [h('div', { class: 'panel cmp' }, rows)];
  if (hasOpt) {
    const mc = D.options.find(o => o.label === MD.choice);
    wrap.push(h('div', { class: 'panel', style: 'padding:16px 20px;margin-top:14px;font-size:14px' },
      h('p', { class: 'k' }, '선택지 비교'),
      '내 선택: ', h('b', {}, S.choice ? S.choice + '안' : '선택 안 함'), ' · 모범답안 선택: ', h('b', {}, MD.choice + '안' + (mc ? ' (' + mc.title + ')' : '')),
      h('div', { class: 'hint', style: 'margin-top:8px' }, '선택이 달라도 괜찮습니다. 이유와 근거가 일관되면 좋은 답안입니다. 모범답안의 판단 이유: ' + (MD.choiceReason || ''))));
  }
  const left = [];
  const matRows = [];
  if (SOLVE && SOLVE.answerKeys && SOLVE.answerKeys.length) {
    const mv = norm(S.ans.V || '');
    const hits = SOLVE.answerKeys.filter(k => mv.includes(norm(k)));
    matRows.push(h('div', { class: 'mrow' }, h('span', { class: 'chip' }, '풀이'), h('div', {}, '정답 핵심값 확인', h('div', { style: 'font-size:12.5px;color:var(--muted)' }, '확인 대상: ' + SOLVE.answerKeys.join(', '))),
      h('span', { class: 'hit ' + (hits.length === SOLVE.answerKeys.length ? 'y' : 'n') }, hits.length === SOLVE.answerKeys.length ? '✔ 모두 일치' : '△ ' + hits.length + '/' + SOLVE.answerKeys.length + ' 일치')));
  }
  mats.forEach((m, i) => {
    const hit = (m.keywords || []).some(k => k && txt.includes(k));
    matRows.push(h('div', { class: 'mrow' }, h('span', { class: 'chip' }, String(i + 1)), h('div', {}, m.title, h('div', { style: 'font-size:12.5px;color:var(--muted)' }, m.insight || '')),
      h('span', { class: 'hit ' + (hit ? 'y' : 'n') }, hit ? '✔ 활용함' : '△ 빠짐')));
  });
  if (matRows.length) left.push(h('div', {}, h('p', { class: 'k' }, '자료·정답 활용 점검 (내 답안에 핵심어가 있는지 자동 확인)'), h('div', { class: 'panel mats' }, matRows)));
  const cl = D.checklist || [];
  const done = () => cl.filter((c, i) => S.checks[i]).length;
  const score = h('div', { class: 'score' });
  const paintScore = () => { score.replaceChildren('자기 진단 점수 ', h('b', {}, done() + ' / ' + cl.length), h('span', { class: 'wnote' }, done() === cl.length ? '모두 충족했습니다.' : '체크되지 않은 항목을 보완해 다시 써보세요.')); };
  paintScore();
  left.push(h('div', {}, h('p', { class: 'k' }, '자기 진단 체크리스트'),
    h('div', { class: 'panel' }, cl.map((c, i) => {
      const cb = h('input', { type: 'checkbox', onchange: () => { S.checks[i] = cb.checked; save(); paintScore(); } });
      cb.checked = !!S.checks[i];
      return h('label', { class: 'chk' }, cb, h('div', {}, c.item, h('small', {}, c.why)));
    }), score)));
  wrap.push(h('div', { class: 'gap', style: 'margin-top:14px' }, left));
  cmpHost.append(...wrap);
}
function compare() {
  renderCompare();
  return sec('compare', 'STEP 3 · 비교', '내 답안과 AI 모범답안 비교', '구조별로 나란히 보고, 자료 활용과 빠진 요소를 점검하세요.', cmpHost);
}

/* ---- 5 답변 방향 ---- */
function direction() {
  const dir = D.direction || [];
  const GRP = { C: '본론 1 · 문제점 및 현황 분석', V: '본론 2 · 해결방안 (PREP)', P: '본론 2 · 해결방안 (PREP)', R: '본론 2 · 해결방안 (PREP)', E: '본론 2 · 해결방안 (PREP)', P2: '본론 2 · 해결방안 (PREP)', F: '본론 3 · 기대효과와 남아있는 문제점', L: '본론 3 · 기대효과와 남아있는 문제점' };
  const line = h('div', { class: 'seq', style: 'border:1px solid var(--rule);border-radius:12px;background:#fff;margin-bottom:14px' },
    h('span', { class: 'wnote' }, '답변 흐름:'), dir.map((d, i) => [i ? h('span', { class: 'ar' }, '→') : null, h('span', { class: 'chip' }, pill(TAG[d.step] || 'E'), (SNAME[d.step] || d.step).replace(/^[PRE] · /, ''))]));
  const items = [];
  let last = '';
  dir.forEach((d, i) => {
    const g = GRP[d.step] || '';
    if (g && g !== last) { items.push(h('div', { class: 'dgrp' }, g)); last = g; }
    items.push(h('div', { class: 'st' },
      h('div', { class: 'lab' }, h('b', {}, String(i + 1)), h('div', {}, pill(TAG[d.step] || 'E'), h('div', { style: 'font-size:13px;margin-top:4px' }, d.title))),
      h('div', { class: 'body' },
        rich(d.guide),
        d.frame ? h('div', { class: 'frame' }, '💬 말하기 틀: ' + d.frame) : null,
        d.refs && d.refs.length ? h('div', { class: 'chips' }, h('span', { class: 'wnote' }, '쓸 자료 →'), d.refs.map(r => mats[r] ? h('span', { class: 'chip' }, h('span', { class: 'dot', style: 'background:' + COL[TAG[d.step] || 'E'] }), '자료 ' + (r + 1) + ' ' + mats[r].title) : null)) : null,
        d.how ? h('div', { class: 'hint' }, '💡 쓰는 법: ' + d.how) : null,
        d.mistake ? h('div', { class: 'warnbox' }, '⚠ 자주 하는 실수: ' + d.mistake) : null)));
  });
  const kids = [legend(), line, h('div', { class: 'panel skel' }, items)];
  if (mats.length) {
    kids.push(h('p', { class: 'k', style: 'margin-top:22px' }, '자료 활용 지도 — 자료가 어느 칸에서 쓰이는가'));
    kids.push(h('div', { class: 'panel' }, table({
      headers: ['자료', '핵심 인사이트', '쓰이는 곳'],
      rows: mats.map((m, i) => ['자료 ' + (i + 1) + ' · ' + m.title, m.insight || '', dir.filter(d => (d.refs || []).includes(i)).map(d => SNAME[d.step] || d.step).join(', ') || '—'])
    })));
  }
  return sec('direction', 'STEP 4 · 답변 방향', '본론 1·2·3 순서로, 해결방안은 PREP로 답을 구성하는 법', '문제 현황 → 해결방안(결론 → 이유 → 근거·실행 → 재강조) → 기대효과 → 남아있는 문제점 순서로, 각 칸에 자료를 어떻게 넣는지 정리했습니다.', ...kids);
}

/* ---- 6 시나리오 ---- */
function scenario() {
  const el = h('div', { class: 'big' }), btn = h('button', { class: 'btn primary' }, '시작'), rs = h('button', { class: 'btn' }, '리셋');
  const st = h('div', { class: 'panel stimer' }, el, btn, rs, h('small', {}, '발표 시간 ' + SPEECH + '분 타이머 · 대본을 소리 내어 읽으며 시간을 재보세요. 이 대본의 예상 발표 시간은 약 ' + totalEst + '분입니다.'));
  const sTimer = makeTimer(SPEECH * 60, el, btn); rs.addEventListener('click', () => sTimer.reset());
  const cards = D.scenario.map((s, i) => h('div', { class: 'panel sc' },
    h('div', { class: 'no' }, String(i + 1).padStart(2, '0')),
    h('h3', {}, s.name, (s.prep || []).map(pill), h('span', { class: 'chip' }, '약 ' + est(s) + '분 · ' + chars(s) + '자')),
    rich(s.script, 'script'),
    s.connector ? h('div', { class: 'applyl' }, h('b', {}, '앞 구간과의 연결 '), s.connector) : null,
    s.check ? h('div', { class: 'checkl' }, h('b', {}, '자기 점검 · '), s.check) : null));
  return sec('scenario', 'STEP 5 · 발표 시나리오', '소리 내어 읽으며 연습하세요', '노란 밑줄은 자문자답 문장입니다. 청중에게 질문하듯 톤을 바꿔 말해보세요. (말하는 속도는 분당 약 330자로 계산했습니다)',
    legend(), st, h('div', { class: 'scs' }, cards));
}

/* ---- 7 논리 흐름 ---- */
function flow() {
  const sc = D.scenario;
  const seq = []; sc.forEach(s => (s.prep || []).forEach(p => seq.push(p)));
  const iE = seq.lastIndexOf('E'), iF = seq.indexOf('F'), iL = seq.indexOf('L');
  const tol = Math.max(0.7, SPEECH * 0.15);
  const checks = [
    { ok: seq[0] === 'P', t: '결론 먼저(P) — 이야기가 결론으로 시작함', f: '첫 요소가 P가 아닙니다. 서론에서 결론을 먼저 말하세요.' },
    { ok: seq.indexOf('C') !== -1 && seq.indexOf('C') < seq.indexOf('E'), t: '문제점 및 현황 분석(C)이 해결방안·근거(E)보다 먼저 나옴', f: '문제 현황을 먼저 말한 뒤 해결방안으로 넘어가세요.' },
    { ok: (() => { const s2 = sc.find(s => s.name.startsWith('본론 2')); const tg = (s2 && s2.prep) || []; return tg.indexOf('P') !== -1 && tg.indexOf('P') < tg.indexOf('R') && tg.indexOf('R') < tg.indexOf('E'); })(), t: '해결방안 구간이 결론(P) → 이유(R) → 근거·실행(E) 순서임', f: '본론 2의 해결방안이 PREP 순서(결론 → 이유 → 근거)로 되어 있지 않습니다.' },
    { ok: iF !== -1 && iF > iE, t: '해결방안 뒤에 기대효과(F)가 나옴', f: '기대효과가 없거나 해결방안보다 앞에 있습니다.' },
    { ok: iL !== -1 && iL > iF, t: '기대효과 뒤에 남은 문제점·보완(L)을 말함', f: '남은 문제점과 보완책이 빠졌습니다. 한계를 먼저 말하면 신뢰가 높아집니다.' },
    { ok: seq.length > 0 && seq[seq.length - 1] === 'P2', t: '마지막에 결론을 다시 말함(P 재강조)', f: '마지막 요소가 결론 재강조가 아닙니다.' },
    { ok: sc.filter(s => s.name.startsWith('본론')).length === 3, t: '본론이 3단 구성임', f: '본론이 3개가 아닙니다.' },
    { ok: sc.slice(1).every(s => (s.connector || '').trim()), t: '모든 구간에 앞 구간과의 연결 문장이 있음', f: '연결 문장이 빠진 구간이 있습니다.' },
    { ok: sc.map(s => (s.script.match(/\[\[.*?\]\]/g) || []).length).reduce((a, b) => a + b, 0) >= 2, t: '자문자답이 2회 이상 들어감', f: '자문자답이 부족해 설명이 일방적일 수 있습니다.' },
    { ok: Math.abs(totalEst - SPEECH) <= tol, t: '대본의 예상 시간(' + totalEst + '분)이 설정한 발표 시간(' + SPEECH + '분)에 맞음', f: '대본 예상 시간 ' + totalEst + '분이 설정한 ' + SPEECH + '분과 ' + (totalEst > SPEECH ? '넘게 길어' : '짧게 차이 나') + ' 있습니다. 분량을 조정하세요.' }
  ];
  const pass = checks.filter(c => c.ok).length;
  const bar = h('div', { class: 'fbar' }, sc.map(s => h('i', { style: 'flex:' + Math.max(est(s), 0.2), title: s.name + ' ' + est(s) + '분' })));
  const fl = h('div', { class: 'panel flow' }, sc.map((s, i) => h('div', { class: 'fl' },
    h('div', { class: 'n' }, String(i + 1)),
    h('div', {}, h('div', { class: 't' }, s.name, (s.prep || []).map(pill), h('span', { class: 'm' }, est(s) + '분')),
      s.connector ? h('div', { class: 'cn' }, h('em', {}, '연결'), s.connector) : h('div', { class: 'cn' }, h('em', {}, '시작'), '청중의 관심을 여는 첫 구간')))));
  const seqRow = h('div', { class: 'seq' }, h('span', { class: 'wnote' }, '발표 흐름:'), seq.map((p, i) => [i ? h('span', { class: 'ar' }, '→') : null, pill(p)]));
  const chk = h('div', { class: 'panel' }, seqRow, checks.map(c => h('div', { class: 'chain' },
    h('span', { class: 'status ' + (c.ok ? 's-ok' : 's-warn') }, c.ok ? '충족' : '보완'),
    h('div', {}, c.ok ? c.t : c.t + ' — ' + c.f))));
  return sec('flow', 'STEP 6 · 논리 흐름', '발표가 논리적으로 이어지는지 점검', '구간의 연결, 문제 현황 → 해결방안 → 기대효과 → 남은 문제점 순서, 시간 배분을 자동으로 확인했습니다. (' + pass + '/' + checks.length + ' 충족)',
    legend(), bar, fl, h('p', { class: 'k', style: 'margin-top:22px' }, '자동 흐름 점검'), chk);
}

const app = $('#app');
app.append(hero(), exam(), mine(), compare(), direction(), scenario(), flow(), h('footer', {}, '이 시험지는 연습용입니다. 자료의 수치·사례는 면접 전 반드시 직접 확인하세요.'));
document.title = 'PT면접 연습 시험지 · ' + M.company;
</script>
