<title>인성면접 연습 시험지</title>

<style>
:root{color-scheme:light;--bg:#f6f8fc;--paper:#fff;--ink:#0f172a;--ink2:#334155;--muted:#64748b;--rule:#e2e8f0;--blue:#1c60ef;--tint:#eef4ff;--ok:#16a34a;--bad:#dc2626;--warn:#fef3c7;--font:"Pretendard Variable",Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 var(--font);word-break:keep-all;overflow-wrap:anywhere}
.top{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.94);border-bottom:1px solid var(--rule);padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.top b{font-size:15px}.top small{color:var(--muted)}
.top .sp{flex:1}
.btn{font:inherit;font-size:13px;font-weight:700;border:1px solid #cbd5e1;background:#fff;color:var(--ink2);padding:7px 14px;border-radius:8px;cursor:pointer}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn.p{background:var(--blue);border-color:var(--blue);color:#fff}
.layout{max-width:1080px;margin:0 auto;padding:16px;display:grid;grid-template-columns:260px 1fr;gap:16px}
.side{position:sticky;top:64px;align-self:start;max-height:calc(100vh - 80px);overflow:auto}
.panel{background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:16px 18px;margin-bottom:14px}
.cat{font-size:12px;font-weight:800;color:var(--blue);margin:12px 4px 4px;letter-spacing:.04em}
.qi{display:block;width:100%;text-align:left;font:inherit;font-size:13.5px;border:1px solid var(--rule);background:#fff;border-radius:9px;padding:8px 10px;margin-bottom:5px;cursor:pointer;color:var(--ink2)}
.qi.on{border-color:var(--blue);background:var(--tint);color:var(--blue);font-weight:700}
.qi.done::after{content:" ✓";color:var(--ok);font-weight:800}
.tag{display:inline-block;font-size:11.5px;font-weight:800;border-radius:6px;padding:2px 8px;background:var(--tint);color:var(--blue);margin-right:6px}
.tag.s{background:var(--warn);color:#92400e}
h2{font-size:20px;line-height:1.4;margin:6px 0 10px;letter-spacing:-.02em}
h3{font-size:15px;margin:0 0 8px}
textarea{width:100%;min-height:210px;font:inherit;line-height:1.7;border:1px solid #cbd5e1;border-radius:10px;padding:12px;resize:vertical}
textarea:focus{outline:2px solid var(--blue);border-color:var(--blue)}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px;font-size:13px;color:var(--muted)}
.bar .sp{flex:1}
.timer{font-variant-numeric:tabular-nums;font-weight:800;color:var(--ink)}
.over{color:var(--bad);font-weight:800}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{border:1px solid var(--rule);padding:8px 10px;text-align:left;vertical-align:top}
th{background:#f8fafc;width:34%}
.hid{display:none}
.trap{background:#fff7ed;border-left:4px solid #f59e0b;padding:10px 14px;border-radius:6px;font-size:14px}
.ans{white-space:pre-wrap;background:#f8fafc;border:1px solid var(--rule);border-radius:10px;padding:14px;font-size:14.5px}
.ol{display:grid;gap:8px}
.ol div{border:1px solid var(--rule);border-radius:10px;padding:10px 12px;font-size:13.5px}
.ol b{color:var(--blue)}
.tail{border-left:3px solid var(--blue);padding:4px 0 4px 12px;margin:8px 0;font-size:14px}
.tail i{font-style:normal;font-weight:800;color:var(--blue)}
.chips span{display:inline-block;background:#fef2f2;color:var(--bad);border-radius:6px;padding:1px 8px;margin:2px 4px 2px 0;font-size:12.5px;font-weight:700}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rate label{font-size:13px;display:block}
.rate input{width:100%}
.foot{max-width:1080px;margin:0 auto;padding:8px 16px 40px;color:var(--muted);font-size:12.5px}
@media (max-width:820px){.layout{grid-template-columns:1fr}.side{position:static;max-height:none}.rate{grid-template-columns:1fr 1fr}}
@media print{.top,.side,.btn{display:none}.layout{display:block}}
</style>
</head>

const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};

  document.querySelectorAll(".qi").forEach(b=>b.onclick=()=>{cur=+b.dataset.i;render()});
  const n=DATA.qs.filter(q=>(st[q.id]||{}).sub).length; $("#prog").textContent=`진행 ${n}/${DATA.qs.length}`;
}
const esc=s=>String(s||"").replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));
function render(){
  clearInterval(tmr); sec=0;

function guide(q){
  const out=(q.outline||[]).map((o,i)=>`<div><b>${i+1}. ${esc(o.label)}</b><br>말하기 틀: ${esc(o.frame)}<br><span style="color:var(--muted)">${esc(o.hint)}</span></div>`).join("");

}
function review(q,s){

}
