<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>관리자 | 방영황</title>
<link rel="icon" href="/favicon.ico" sizes="any" />
<style>
  :root { --ink:#0a0a0a; --muted:#6b7280; --line:#e5e7eb; --accent:#4f46e5; --soft:#eef2ff; --bg:#f8f9fc; --err:#dc2626; --ok:#15803d; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:Pretendard,"Malgun Gothic","Apple SD Gothic Neo",sans-serif; line-height:1.6; }
  .wrap { max-width:760px; margin:0 auto; padding:32px 16px 72px; }
  header { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:20px; }
  h1 { margin:0; font-size:22px; }
  h2 { margin:0 0 14px; font-size:16px; }
  a { color:var(--accent); }
  .card { background:#fff; border:1px solid var(--line); border-radius:16px; padding:22px; margin-bottom:16px; }
  label.field { display:block; margin-bottom:16px; font-size:14px; font-weight:700; }
  label.field small { font-weight:400; color:var(--muted); }
  input[type=text], input[type=url], input[type=password], textarea { display:block; width:100%; margin-top:6px; padding:11px 12px; border:1px solid var(--line); border-radius:10px; font:inherit; font-weight:400; background:#fff; }
  input:focus, textarea:focus { outline:2px solid var(--accent); outline-offset:-1px; border-color:transparent; }
  textarea { min-height:120px; resize:vertical; }
  .choices { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
  .choices label { cursor:pointer; }
  .choices input { position:absolute; opacity:0; }
  .choices span { display:block; padding:9px 18px; border:1px solid var(--line); border-radius:999px; font-size:14px; font-weight:700; background:#fff; }
  .choices input:checked + span { background:var(--soft); border-color:var(--accent); color:var(--accent); }
  .choices input:focus-visible + span { outline:2px solid var(--accent); outline-offset:2px; }
  .drop { display:block; padding:26px 16px; margin-bottom:16px; border:2px dashed #c7d2fe; border-radius:14px; background:var(--soft); text-align:center; cursor:pointer; font-size:14px; }
  .drop.is-over { border-color:var(--accent); background:#e0e7ff; }
  .drop strong { display:inline-block; padding:9px 20px; margin-bottom:8px; border-radius:999px; background:var(--accent); color:#fff; }
  .drop small { display:block; color:var(--muted); word-break:break-all; }
  .drop input { position:absolute; width:1px; height:1px; opacity:0; }
  .check { display:flex; align-items:center; gap:8px; margin-bottom:18px; font-size:14px; font-weight:600; }
  button { font:inherit; cursor:pointer; }
  .primary { width:100%; padding:13px; border:0; border-radius:999px; background:var(--ink); color:#fff; font-weight:800; }
  .primary:disabled { opacity:.5; cursor:default; }
  .ghost { padding:7px 14px; border:1px solid var(--line); border-radius:999px; background:#fff; font-size:13px; font-weight:700; }
  .progress { height:8px; margin-top:14px; border-radius:999px; background:var(--line); overflow:hidden; }
  .progress i { display:block; width:0; height:100%; background:var(--accent); transition:width .2s; }
  .status { min-height:22px; margin:12px 0 0; font-size:14px; }
  .status.err { color:var(--err); } .status.ok { color:var(--ok); }
  .row { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:11px 0; border-top:1px solid var(--line); font-size:14px; }
  .row:first-child { border-top:0; }
  .row b { font-weight:700; word-break:break-all; }
  .row small { display:block; color:var(--muted); }
  input[type=date] { display:block; margin-top:6px; padding:9px 10px; border:1px solid var(--line); border-radius:10px; font:inherit; background:#fff; }
  .inline { display:flex; flex-wrap:wrap; gap:10px; align-items:flex-end; margin-bottom:14px; }
  .inline label.field { flex:1 1 180px; margin:0; }
  .inline .primary { width:auto; padding:11px 22px; }
  .code { font-family:Consolas,"Courier New",monospace; font-size:15px; font-weight:800; letter-spacing:.04em; }
  .badge { display:inline-block; padding:2px 9px; border-radius:999px; font-size:12px; font-weight:700; background:#dcfce7; color:#166534; }
  .badge.off { background:#f3f4f6; color:#6b7280; }
  .badge.end { background:#fee2e2; color:#b91c1c; }
  .tools { display:flex; flex-wrap:wrap; gap:6px; align-items:center; justify-content:flex-end; }
  .tools input[type=date] { margin:0; padding:6px 8px; font-size:13px; }
  .note { margin:0 0 14px; font-size:13px; color:var(--muted); }
  .lockrow { display:flex; align-items:center; gap:10px; padding:9px 0; border-top:1px solid var(--line); font-size:14px; cursor:pointer; }
  .lockrow b { font-weight:600; }
  .lockrow small { color:var(--muted); margin-left:auto; white-space:nowrap; }
  .lockgroup { margin:18px 0 4px; font-size:13px; font-weight:800; color:var(--muted); }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>관리자</h1>
    <div>
      <a class="ghost" href="/" style="text-decoration:none;color:inherit">사이트 보기</a>
      <button class="ghost hidden" id="logoutBtn" type="button">로그아웃</button>
    </div>
  </header>

  <!-- 로그인 -->
  <form class="card hidden" id="loginCard">
    <label class="field">관리자 비밀번호
      <input type="password" id="password" autocomplete="current-password" required />
    </label>
    <button class="primary" type="submit">로그인</button>
    <p class="status" id="loginStatus" role="status"></p>
  </form>

  <!-- 설정 안내 -->
  <div class="card hidden" id="setupCard">
    <h2>아직 관리자 비밀번호가 없습니다</h2>
    <p>Vercel 환경변수에 <b>ADMIN_PASSWORD</b>를 10자 이상으로 넣고 다시 배포해 주세요.</p>
  </div>

  <!-- 올리기 -->
  <form class="card hidden" id="uploadCard">
    <div class="choices" role="radiogroup" aria-label="종류">
      <label><input type="radio" name="type" value="자료" checked /><span>자료 공유</span></label>
      <label><input type="radio" name="type" value="영상" /><span>강의 영상</span></label>
    </div>

    <label class="drop" id="drop">
      <strong>파일 첨부</strong>
      <small id="fileName">내 컴퓨터에서 파일을 고르거나 여기로 끌어다 놓으세요</small>
      <input type="file" id="file" accept=".pdf,.ppt,.pptx,.doc,.docx,.xls,.xlsx,.hwp,.hwpx,.zip,.txt,.mp4,.webm,.mov,.m4v,.png,.jpg,.jpeg" />
    </label>

    <label class="field">또는 링크 <small>(유튜브, 구글 드라이브 등. 파일을 첨부하면 링크는 쓰지 않습니다)</small>
      <input type="url" id="link" placeholder="https://" />
    </label>
    <label class="field">제목
      <input type="text" id="title" maxlength="120" required />
    </label>
    <label class="field">한 줄 설명 <small>(목록 카드에 표시)</small>
      <input type="text" id="description" maxlength="300" />
    </label>
    <label class="field">자세한 설명 <small>(눌렀을 때 나오는 글)</small>
      <textarea id="body" maxlength="8000"></textarea>
    </label>
    <label class="check"><input type="checkbox" id="published" checked /> 바로 사이트에 공개</label>
    <label class="check" id="lockWrap"><input type="checkbox" id="lockNew" /> 코드를 입력한 사람만 내려받기 (자료만 해당)</label>

    <button class="primary" id="submitBtn" type="submit">올리기</button>
    <div class="progress hidden" id="progress"><i id="progressBar"></i></div>
    <p class="status" id="uploadStatus" role="status"></p>
  </form>

  <!-- 접근 코드 -->
  <div class="card hidden" id="codeCard">
    <h2>접근 코드</h2>
    <p class="note">강의 기관·기수별로 코드를 하나 만들어 수강생에게 알려 주세요. 만료일이 지나거나 '중지'하면 그 코드로는 더 이상 열리지 않습니다(최대 1분 안에 반영).</p>
    <form class="inline" id="codeForm">
      <label class="field">기관·기수 이름 <input type="text" id="codeName" maxlength="80" placeholder="예) ○○대학교 2026-2학기" required /></label>
      <label class="field">코드 <small>(비우면 자동 생성)</small> <input type="text" id="codeValue" maxlength="40" placeholder="BANG-XXXX-XXXX" autocomplete="off" /></label>
      <label class="field">만료일 <small>(비우면 기간 제한 없음)</small> <input type="date" id="codeExpires" /></label>
      <button class="primary" id="codeBtn" type="submit">코드 만들기</button>
    </form>
    <p class="status" id="codeStatus" role="status"></p>
    <div id="codeList"></div>
  </div>

  <!-- 잠금 설정 -->
  <div class="card hidden" id="lockCard">
    <h2>코드로 잠글 프롬프트·자료</h2>
    <p class="note">체크한 항목은 코드를 입력한 사람만 프롬프트 복사·자료 내려받기를 할 수 있습니다. 제목과 설명은 누구에게나 보입니다. 체크하면 바로 저장됩니다.</p>
    <div id="lockList"></div>
  </div>

  <!-- 최근 목록 -->
  <div class="card hidden" id="listCard">
    <h2>최근 올린 자료·영상</h2>
    <div id="list"></div>
  </div>
</div>

<script type="module">
  const $ = (id) => document.getElementById(id);
  const show = (el, on = true) => el.classList.toggle("hidden", !on);
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  const CONTENT_TYPES = { hwp: "application/x-hwp", hwpx: "application/hwp+zip", mov: "video/quicktime", m4v: "video/mp4" };

  async function api(action, data = {}) {
    const res = await fetch("/api/admin", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action, ...data }),
    });
    const json = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(json.error || "요청에 실패했습니다.");
    return json;
  }

  function setStatus(el, message, kind = "") {
    el.textContent = message;
    el.className = `status ${kind}`;
  }

  async function renderList() {
    const { items } = await api("list");
    $("list").innerHTML =
      items
        .map(
          (i) => `<div class="row"><div><b>${esc(i.title)}</b><small>${esc(i.type)} · ${esc(i.status === "발행" ? "공개 중" : "비공개")} · ${esc(i.createdTime.slice(0, 10))}</small></div>
          <button class="ghost" type="button" data-id="${esc(i.id)}" data-publish="${i.status !== "발행"}">${i.status === "발행" ? "내리기" : "공개하기"}</button></div>`
        )
        .join("") || "<p>아직 없습니다.</p>";
  }

  // ── 접근 코드 ──
  async function renderCodes() {
    const { codes } = await api("codeList");
    $("codeList")._codes = codes;
    $("codeList").innerHTML =
      codes
        .map((c) => {
          const state = !c.active ? ["중지됨", "off"] : c.expired ? ["만료됨", "end"] : ["사용 중", ""];
          return `<div class="row"><div><b>${esc(c.name)}</b> <span class="badge ${state[1]}">${state[0]}</span>
            <small><span class="code">${esc(c.code)}</span> · ${c.expires ? `${esc(c.expires)}까지` : "기간 제한 없음"}</small></div>
            <div class="tools">
              <button class="ghost" type="button" data-copy="${esc(c.id)}">안내문 복사</button>
              <input type="date" value="${esc(c.expires)}" data-expires="${esc(c.id)}" aria-label="만료일 변경" />
              <button class="ghost" type="button" data-toggle="${esc(c.id)}" data-active="${c.active}">${c.active ? "중지" : "다시 사용"}</button>
              <button class="ghost" type="button" data-del="${esc(c.id)}">삭제</button>
            </div></div>`;
        })
        .join("") || "<p>아직 만든 코드가 없습니다.</p>";
  }

  $("codeForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    $("codeBtn").disabled = true;
    try {
      const { code } = await api("codeCreate", { name: $("codeName").value, code: $("codeValue").value, expires: $("codeExpires").value });
      setStatus($("codeStatus"), `만들었습니다. 코드: ${code.code}`, "ok");
      $("codeForm").reset();
      await renderCodes();
    } catch (err) {
      setStatus($("codeStatus"), err.message, "err");
    } finally {
      $("codeBtn").disabled = false;
    }
  });

  $("codeList").addEventListener("click", async (e) => {
    const btn = e.target.closest("button");
    if (!btn) return;
    const codes = $("codeList")._codes || [];
    try {
      if (btn.dataset.copy) {
        const c = codes.find((x) => x.id === btn.dataset.copy);
        const until = c.expires ? `사용 기간: ${c.expires}까지\n` : "";
        await navigator.clipboard.writeText(`[방영황 취업 교육 자료 안내]\n접속: ${location.origin}\n접근 코드: ${c.code}\n${until}사이트에서 🔒 표시가 있는 프롬프트·자료를 열면 코드를 입력하는 창이 나옵니다.`);
        btn.textContent = "복사됨";
        setTimeout(() => (btn.textContent = "안내문 복사"), 1500);
      } else if (btn.dataset.toggle) {
        await api("codeUpdate", { id: btn.dataset.toggle, active: btn.dataset.active !== "true" });
        await renderCodes();
      } else if (btn.dataset.del) {
        if (!confirm("이 코드를 삭제할까요? 이 코드를 쓰던 사람들은 더 이상 열 수 없습니다.")) return;
        await api("codeDelete", { id: btn.dataset.del });
        await renderCodes();
      }
    } catch (err) {
      alert(err.message);
    }
  });

  $("codeList").addEventListener("change", async (e) => {
    const input = e.target.closest("[data-expires]");
    if (!input) return;
    try {
      await api("codeUpdate", { id: input.dataset.expires, expires: input.value });
      await renderCodes();
    } catch (err) {
      alert(err.message);
    }
  });

  // ── 잠금 설정 ──
  async function renderLocks() {
    const { items } = await api("lockList");
    let html = "";
    ["프롬프트", "자료"].forEach((type) => {
      const rows = items.filter((i) => i.type === type);
      if (!rows.length) return;
      html += `<div class="lockgroup">${type} ${rows.length}개</div>`;
      html += rows
        .map(
          (i) => `<label class="lockrow"><input type="checkbox" data-lock="${esc(i.id)}" ${i.locked ? "checked" : ""} />
            <b>${esc(i.title)}</b><small>${esc(i.category)}${i.status === "초안" ? " · 비공개" : ""}</small></label>`
        )
        .join("");
    });
    $("lockList").innerHTML = html || "<p>아직 없습니다.</p>";
  }

  $("lockList").addEventListener("change", async (e) => {
    const box = e.target.closest("[data-lock]");
    if (!box) return;
    box.disabled = true;
    try {
      await api("setLock", { id: box.dataset.lock, locked: box.checked });
    } catch (err) {
      box.checked = !box.checked;
      alert(err.message);
    } finally {
      box.disabled = false;
    }
  });

  document.querySelectorAll("input[name=type]").forEach((r) =>
    r.addEventListener("change", () => show($("lockWrap"), document.querySelector("input[name=type]:checked").value === "자료"))
  );

  async function enter() {
    show($("loginCard"), false);
    show($("uploadCard"));
    show($("codeCard"));
    show($("lockCard"));
    show($("listCard"));
    show($("logoutBtn"));
    await Promise.all([renderList(), renderCodes(), renderLocks()]);
  }

  // ── 시작 ──
  const state = await (await fetch("/api/admin")).json();
  if (!state.enabled) show($("setupCard"));
  else if (state.loggedIn) await enter();
  else show($("loginCard"));

  $("loginCard").addEventListener("submit", async (e) => {
    e.preventDefault();
    setStatus($("loginStatus"), "확인 중...");
    try {
      await api("login", { password: $("password").value });
      $("password").value = "";
      setStatus($("loginStatus"), "");
      await enter();
    } catch (err) {
      setStatus($("loginStatus"), err.message, "err");
    }
  });

  $("logoutBtn").addEventListener("click", async () => {
    await api("logout");
    location.reload();
  });

  // ── 파일 고르기 ──
  function picked() {
    const f = $("file").files[0];
    $("fileName").textContent = f ? `${f.name} (${(f.size / 1024 / 1024).toFixed(1)}MB)` : "내 컴퓨터에서 파일을 고르거나 여기로 끌어다 놓으세요";
    if (f && !$("title").value) $("title").value = f.name.replace(/\.[^.]+$/, "");
    if (f && /\.(mp4|webm|mov|m4v)$/i.test(f.name)) document.querySelector('input[name=type][value="영상"]').checked = true;
  }
  $("file").addEventListener("change", picked);
  ["dragover", "dragenter"].forEach((t) => $("drop").addEventListener(t, (e) => { e.preventDefault(); $("drop").classList.add("is-over"); }));
  ["dragleave", "drop"].forEach((t) => $("drop").addEventListener(t, () => $("drop").classList.remove("is-over")));
  $("drop").addEventListener("drop", (e) => {
    e.preventDefault();
    if (e.dataTransfer.files.length) {
      $("file").files = e.dataTransfer.files;
      picked();
    }
  });

  // ── 올리기 ──
  $("uploadCard").addEventListener("submit", async (e) => {
    e.preventDefault();
    const file = $("file").files[0];
    let link = $("link").value.trim();
    const type = document.querySelector("input[name=type]:checked").value;
    if (!file && !link) return setStatus($("uploadStatus"), "파일을 첨부하거나 링크를 넣어 주세요.", "err");
    $("submitBtn").disabled = true;
    try {
      if (file) {
        show($("progress"));
        $("progressBar").style.width = "0";
        setStatus($("uploadStatus"), "파일을 올리는 중입니다. 창을 닫지 마세요.");
        const { uploadPresigned } = await import("https://cdn.jsdelivr.net/npm/@vercel/blob@2.8.2/client/+esm");
        const ext = file.name.split(".").pop().toLowerCase();
        const pathname = `${type === "영상" ? "videos" : "materials"}/${file.name}`;
        const multipart = file.size > 20 * 1024 * 1024;
        const blob = await uploadPresigned(pathname, file, {
          access: "public",
          handleUploadUrl: "/api/admin-upload",
          contentType: file.type || CONTENT_TYPES[ext],
          multipart,
          onUploadProgress: ({ percentage }) => { $("progressBar").style.width = `${percentage}%`; },
        }).catch(async (err) => {
          // SDK가 서버 오류 내용을 가리므로, 같은 요청을 다시 보내 실제 이유를 보여줍니다
          if (!/presigned URL/.test(err.message)) throw err;
          const res = await fetch("/api/admin-upload", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ type: "blob.generate-presigned-url", payload: { pathname, clientPayload: null, multipart } }),
          });
          const json = await res.json().catch(() => ({}));
          throw new Error(json.error ? `업로드 허가 실패: ${json.error}` : err.message);
        });
        // 자료는 누르면 바로 내려받기, 영상은 사이트에서 재생
        link = type === "영상" ? blob.url : blob.downloadUrl;
      }
      setStatus($("uploadStatus"), "사이트에 등록하는 중입니다...");
      await api("publish", {
        type,
        link,
        title: $("title").value,
        description: $("description").value,
        body: $("body").value,
        published: $("published").checked,
        locked: type === "자료" && $("lockNew").checked,
      });
      setStatus($("uploadStatus"), $("published").checked ? "올렸습니다. 1분 안에 사이트에 나타납니다." : "비공개로 저장했습니다.", "ok");
      $("uploadCard").reset();
      picked();
      await Promise.all([renderList(), renderLocks()]);
    } catch (err) {
      setStatus($("uploadStatus"), err.message || "올리지 못했습니다. 다시 시도해 주세요.", "err");
    } finally {
      $("submitBtn").disabled = false;
      show($("progress"), false);
    }
  });

  // ── 공개/내리기 ──
  $("list").addEventListener("click", async (e) => {
    const btn = e.target.closest("[data-id]");
    if (!btn) return;
    btn.disabled = true;
    try {
      await api("setStatus", { id: btn.dataset.id, published: btn.dataset.publish === "true" });
      await renderList();
    } catch (err) {
      btn.disabled = false;
      alert(err.message);
    }
  });
</script>
</body>
